<!DOCTYPE html>
<!--
  指示書09 T4 / 芥川様 screen7.html L163-443 準拠版 (2026-06-04)。
  L字レイアウト右下（cell-3、幅80%×高さ約20%）用。
  芥川様 screen7.html の .message__bottom 構造を踏襲し、馬連 / 馬単 / 3連複 / 3連単
  の人気上位1〜10位を 2サブカラム×5行 で並べる（旧版の 1〜5 → 1〜10 に拡張）。
-->
<html lang="ja" class="single-screen lshape-bottom">
<head>
  <meta charset="UTF-8">
  <title>人気順 4賭式 上位1〜10（L字右下）</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../assets/css/style.css?v=20260819a">
  <!-- L字右下固有スタイル (.lshape-bottom / .message.bottom-only) は dos-overrides.css に集約。 -->
  <link rel="stylesheet" href="../assets/css/dos-overrides.css?v=20260819a">
  <script src="../assets/js/common.js?v=20260819a"></script>
</head>
<body>

<div class="wrapper">
  <div class="message bottom-only">
    <div class="message__bottom">
      <section class="message__bet-col" aria-labelledby="message-bet-umaren">
        <div class="message__bet-head" id="message-bet-umaren">馬連 上位1〜10</div>
        <div class="message__bet-body message__bet-body--pair">
          <div class="message__bet-subcol" id="umarenSubcolA"></div>
          <div class="message__bet-subcol" id="umarenSubcolB"></div>
        </div>
      </section>

      <section class="message__bet-col" aria-labelledby="message-bet-umatan">
        <div class="message__bet-head" id="message-bet-umatan">馬単 上位1〜10</div>
        <div class="message__bet-body message__bet-body--pair">
          <div class="message__bet-subcol" id="umatanSubcolA"></div>
          <div class="message__bet-subcol" id="umatanSubcolB"></div>
        </div>
      </section>

      <section class="message__bet-col" aria-labelledby="message-bet-trio">
        <div class="message__bet-head" id="message-bet-trio">3連複 上位1〜10</div>
        <div class="message__bet-body message__bet-body--triple">
          <div class="message__bet-subcol" id="trioSubcolA"></div>
          <div class="message__bet-subcol" id="trioSubcolB"></div>
        </div>
      </section>

      <section class="message__bet-col" aria-labelledby="message-bet-trif">
        <div class="message__bet-head" id="message-bet-trif">3連単 上位1〜10</div>
        <div class="message__bet-body message__bet-body--triple">
          <div class="message__bet-subcol" id="trifectaSubcolA"></div>
          <div class="message__bet-subcol" id="trifectaSubcolB"></div>
        </div>
      </section>
    </div>
  </div>
</div>

<script>
(function() {
  var D = window.OddsDemo;
  var dataUrl = null;
  var currentPoller = null;
  var lastData = null;
  var serverOffsetMs = 0;

  // 賭式ごとの上位件数（screen7 は上位1〜10）と subcol 分割
  var ENTRIES_PER_BET = 10;
  var ROWS_PER_SUBCOL = 5;

  // 枠番 → number-* クラス名（.message__num に付与）
  var FRAME_TO_NUMBER_CLASS = {
    1: 'number-white', 2: 'number-black', 3: 'number-red', 4: 'number-blue',
    5: 'number-yellow', 6: 'number-green', 7: 'number-orange', 8: 'number-pink'
  };

  function numClass(horses, horseNo) {
    var frame = D.frameOfHorse(horses, horseNo);
    return FRAME_TO_NUMBER_CLASS[frame] || 'number-white';
  }

  // 1件分の .message__bet-row を生成。entry が null なら空行（プレースホルダ）。
  // O-3b (2026-07-29): betType を引数化。従来は 4 賭式すべてに 'wide' を渡しており、
  //   3連複・3連単のオッズ上限が 9999.9（ワイドの cap）で頭打ちになっていた
  //   （JSON構造仕様書 v0.6.6 §4.2: NAR 3連複/3連単は 99999.9）。
  function buildRow(entry, horses, combSize, race, betType) {
    var row = D.el('div', 'message__bet-row');
    var combo = D.el('div', 'message__bet-combo');
    if (entry) {
      var keys = combSize === 2 ? ['a', 'b'] : ['a', 'b', 'c'];
      keys.forEach(function(k, idx) {
        var num = entry[k];
        combo.appendChild(D.el('span', 'message__num ' + numClass(horses, num), num));
        if (idx < keys.length - 1) {
          combo.appendChild(D.el('span', 'message__bet-hyphen', '-'));
        }
      });
    } else {
      // 空セル: 馬番セルは空、ハイフンのみ並べる
      for (var i = 0; i < combSize; i++) {
        combo.appendChild(D.el('span', 'message__num', ''));
        if (i < combSize - 1) combo.appendChild(D.el('span', 'message__bet-hyphen', '-'));
      }
    }
    row.appendChild(combo);

    // O-3: rank<=3 のアクセントを廃し、桁数ベースに統一
    var oddsCls = entry
      ? D.oddsClass('message__bet-odds', entry.odds, betType, race && race.organizer_type)
      : 'message__bet-odds';
    // O-3b: entry なし（票未着・件数不足）は '0.0' ではなく '-'
    var oddsText = entry ? D.fmtOdds(entry.odds, betType, race && race.organizer_type) : D.ODDS_EMPTY;
    // DOS-05 (2026-08-19): 桁数で溢れないよう表示文字数を --odds-len で渡す
    row.appendChild(D.setOddsLen(D.el('div', oddsCls, oddsText), oddsText));
    return row;
  }

  function renderBetSection(subcolAId, subcolBId, list, horses, combSize, race, betType) {
    var rows = (list || []).slice(0, ENTRIES_PER_BET);
    var subA = document.getElementById(subcolAId);
    var subB = document.getElementById(subcolBId);
    var fragA = document.createDocumentFragment();
    var fragB = document.createDocumentFragment();
    for (var i = 0; i < ENTRIES_PER_BET; i++) {
      var entry = rows[i];
      var row = buildRow(entry, horses, combSize, race, betType);
      if (i < ROWS_PER_SUBCOL) {
        fragA.appendChild(row);
      } else {
        fragB.appendChild(row);
      }
    }
    subA.replaceChildren(fragA);
    subB.replaceChildren(fragB);
  }

  function render(data) {
    var race = data.race || {};
    var horses = data.horses || [];
    lastData = data;

    // 指示書08: 取消馬を含むエントリを除外してから上位10件表示
    var umarenList   = D.filterScratchedFromPopular(data.umaren_popular,   horses, 2);
    var umatanList   = D.filterScratchedFromPopular(data.umatan_popular,   horses, 2);
    var trioList     = D.filterScratchedFromPopular(data.trio_popular,     horses, 3);
    var trifectaList = D.filterScratchedFromPopular(data.trifecta_popular, horses, 3);

    renderBetSection('umarenSubcolA',   'umarenSubcolB',   umarenList,   horses, 2, race, 'quinella');
    renderBetSection('umatanSubcolA',   'umatanSubcolB',   umatanList,   horses, 2, race, 'exacta');
    renderBetSection('trioSubcolA',     'trioSubcolB',     trioList,     horses, 3, race, 'trio');
    renderBetSection('trifectaSubcolA', 'trifectaSubcolB', trifectaList, horses, 3, race, 'trifecta');
  }

  function startPolling() {
    if (currentPoller) currentPoller.stop();
    currentPoller = D.startResilientPolling({
      name: 'wide-popular',
      baseIntervalMs: D.pollInterval,
      fetch: function() {
        if (!dataUrl) return Promise.reject(new Error('dataUrl not set'));
        return D.fetchWithOffset(dataUrl);
      },
      onSuccess: function(res) {
        render(res.data);
        if (window.parent !== window) {
          window.parent.postMessage({
            type: 'childServerTime',
            url: dataUrl,
            serverTime: res.data.server_time,
            offset: res.serverOffset
          }, '*');
        }
      }
    });
    D.registerPoller(currentPoller);
  }

  window.addEventListener('message', function(e) {
    if (e.data && e.data.type === 'setDataUrl') {
      dataUrl = e.data.url;
      startPolling();
    }
  });
})();
</script>
</body>
</html>
