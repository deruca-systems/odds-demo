<!DOCTYPE html>
<!--
  指示書09 T2 / 芥川様 screen7.html L15-156 準拠版 (2026-06-04)。
  L字レイアウト左袖（cell-1、幅20%）用の出走表テンプレート。
  芥川様 screen7.html の .message__sidebar 構造を踏襲し、枠ごとにグループ化して
  「枠 / 馬番 / 馬名 / 単勝」を表示する。
-->
<html lang="ja" class="single-screen lshape-side">
<head>
  <meta charset="UTF-8">
  <title>出走表（L字左袖）</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../assets/css/style.css?v=20260604">
  <!-- L字左袖固有スタイル (.lshape-side / .message.sidebar-only) は dos-overrides.css に集約。 -->
  <link rel="stylesheet" href="../assets/css/dos-overrides.css?v=20260604e">
  <script src="../assets/js/common.js?v=20260715a"></script>
</head>
<body>

<div class="wrapper">
  <div class="message sidebar-only" id="messageRoot" style="--horse-count: 10;">
    <div class="message__sidebar">
      <div class="message__race-head">
        <span id="hdr-venue"></span><span class="message__race-head-number" id="hdr-race"><span>R</span></span>
      </div>
      <div class="message__horse-table">
        <div class="message__horse-table-head">
          <div>枠</div>
          <div>馬番</div>
          <div>馬名</div>
          <div class="win">単勝</div>
        </div>
        <div class="message__horse-table-body" id="horseBody"></div>
      </div>
    </div>
  </div>
</div>

<!-- C-03 (2026-04-17): L字レイアウト専用テンプレのため、カットインDOM挿入はしない。 -->

<script>
(function() {
  var D = window.OddsDemo;
  var dataUrl = null;
  var currentPoller = null;
  var lastData = null;
  var serverOffsetMs = 0;

  // 枠番 → row-* クラス名（screen7.html L25 等と整合）
  var FRAME_TO_ROW_CLASS = {
    1: 'row-white', 2: 'row-black', 3: 'row-red', 4: 'row-blue',
    5: 'row-yellow', 6: 'row-green', 7: 'row-orange', 8: 'row-pink'
  };

  function renderRaceHead(race) {
    // field-rename-v0.5 (2026-04-20): race.venue → race.place_name、race.race_no → race.rr
    var venueEl = document.getElementById('hdr-venue');
    var raceEl  = document.getElementById('hdr-race');
    if (venueEl) venueEl.textContent = race.place_name || '';
    if (raceEl) {
      // 「2<span>R</span>」の構造を保つため textContent ではなく直接書き換え
      var num = race.rr != null ? race.rr : '';
      raceEl.innerHTML = String(num) + '<span>R</span>';
    }
  }

  // 枠番でグループ化して .message__horse-table-group を出力。
  // 各 group は枠セル（rowspan 相当）+ その枠の馬行を縦積みする。
  function renderHorses(horses, race) {
    var msgEl = document.getElementById('messageRoot');
    msgEl.style.setProperty('--horse-count', horses.length || 10);
    var body = document.getElementById('horseBody');
    var fragment = document.createDocumentFragment();

    var winCls = D.computeWinClasses(horses);
    var organizerType = race && race.organizer_type;

    // 枠番でグループ化（出現順を維持）
    var groups = [];
    var currentGroup = null;
    horses.forEach(function(h) {
      var frame = h.frame_no;
      if (!currentGroup || currentGroup.frame !== frame) {
        currentGroup = { frame: frame, horses: [] };
        groups.push(currentGroup);
      }
      currentGroup.horses.push(h);
    });

    groups.forEach(function(g) {
      var groupCls = 'message__horse-table-group ' + (FRAME_TO_ROW_CLASS[g.frame] || 'row-white');
      var group = D.el('div', groupCls);
      group.appendChild(D.el('div', 'message__horse-frame', g.frame));
      var rows = D.el('div', 'message__horse-table-group-rows');
      g.horses.forEach(function(h) {
        var isScratched = !!h.is_scratched;
        var row = D.el('div', 'message__horse-table-row' + (isScratched ? ' row-scratched' : ''));
        row.appendChild(D.el('div', 'message__horse-number', h.horse_no));
        var name = D.el('div', 'message__horse-name', h.horse_name);
        name.style.setProperty('--name-length', (h.horse_name || '').length);
        row.appendChild(name);
        if (isScratched) {
          // 取消馬は短縮ラベル（人気順画面と同じ運用）
          row.appendChild(D.el('div', 'message__horse-win race-table__scratched', D.scratchedLabelShort(h.is_scratched)));
        } else {
          var winClass = winCls[h.horse_no] || '';
          row.appendChild(D.el('div', 'message__horse-win' + (winClass ? ' ' + winClass : ''), D.fmtOdds(h.win_odds, 'win', organizerType)));
        }
        rows.appendChild(row);
      });
      group.appendChild(rows);
      fragment.appendChild(group);
    });

    body.replaceChildren(fragment);
  }

  function render(data) {
    var race = data.race || {};
    var horses = data.horses || [];
    lastData = data;
    renderRaceHead(race);
    renderHorses(horses, race);
  }

  // 指示書07: 指数バックオフ付きポーリング
  function startPolling() {
    if (currentPoller) currentPoller.stop();
    currentPoller = D.startResilientPolling({
      name: 'side-entries',
      baseIntervalMs: D.pollInterval,
      fetch: function() {
        if (!dataUrl) return Promise.reject(new Error('dataUrl not set'));
        return D.fetchWithOffset(dataUrl);
      },
      onSuccess: function(res) {
        render(res.data);
        if (window.parent !== window) {
          window.parent.postMessage({
            type: 'childServerTime',
            url: dataUrl,
            serverTime: res.data.server_time,
            offset: res.serverOffset
          }, '*');
        }
      }
    });
    D.registerPoller(currentPoller);
  }

  window.addEventListener('message', function(e) {
    if (e.data && e.data.type === 'setDataUrl') {
      dataUrl = e.data.url;
      startPolling();
    }
  });
})();
</script>
</body>
</html>
