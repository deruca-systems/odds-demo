<!DOCTYPE html>
<!--
  dp=2 単勝・複勝・馬体重・斤量・騎手名フルネーム（screen1-fullname 相当）
  ------------------------------------------------------------------
  デザイン screen1-fullname.html（keiba-odds 28a1aeb）に対応する区画テンプレ。
  dp=1（single-screen.html）との違いは次の4点だけで、他は同一:
    ・<html> に fullname を付ける（デザイン CSS の .fullname 配下が有効になる）
    ・斤量の列を追加（減量記号ぶんを引いた実負担重量）
    ・馬体重の増減に weight-diff--plus/--minus と weight-diff__paren を付ける
    ・騎手名を切り詰めない
  枠連／枠単は CSS 側で畳まれるため出さない（applyFramePage で常時非表示）。

  🔴 このファイルは scratchpad/gen_fullname.py が single-screen.html から生成する。
     single-screen.html を直したら**生成し直す**こと。手で両方を直さない。
-->
<html lang="ja" data-dos-hide-until-data="1" class="single-screen fullname">
<head>
  <meta charset="UTF-8">
  <title>単勝・複勝・馬体重・斤量・騎手名フルネーム 単体表示</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../assets/css/style.css?v=20260830a">
  <link rel="stylesheet" href="../assets/css/dos-overrides.css?v=20260830a">
  <script src="../assets/js/common.js?v=20260830a"></script>
</head>
<body>

<div class="wrapper">
  <div class="screen" id="screen">
    <div class="race-header header-green">
      <div class="race-title">
        <span id="hdr-venue"></span><span class="race" id="hdr-race"><span>R</span></span><span id="hdr-raceName"></span><span id="hdr-raceClass"></span>
      </div>
      <div class="race-info">
        <div class="weather">
          <img class="weather-icon" id="hdr-weatherIcon" src="../assets/images/weather/sunny.svg" alt="">
          <span id="hdr-weatherLabel"></span>
        </div>
        <div class="course">
          <span class="course-condition" id="hdr-condition"></span>
          <span class="course-surface" id="hdr-surface"></span>
          <span class="course-distance" id="hdr-distance"></span>
          <span class="course-direction" id="hdr-direction"></span>
        </div>
        <div class="race-time">
          <span>締切</span><span class="minute" id="hdr-deadline"></span><span>分前</span>
        </div>
      </div>
      <div class="previous-day is-hidden"><span>前日発売</span></div>
    </div>
    <div class="race-main">
      <div class="race-table">
        <div class="race-table__head">
          <div>枠</div>
          <div>馬番</div>
          <div>馬名</div>
          <div class="win">単勝</div>
          <div class="win">複勝</div>
          <div>馬体重</div>
          <div>斤量</div>
          <div>騎手名</div>
        </div>
        <div class="race-table__body" id="horseBody"></div>
      </div>
      <!-- H-03 : id="frame-uren" 付与、親からの postMessage frameOddsPage で表示切替 -->
      <div class="frame-odds" id="frame-uren">
        <div class="frame-odds__head"><div>枠連</div></div>
        <div class="frame-odds__body" id="frameOddsBody"></div>
      </div>
      <!-- H-03 : 枠単ブロック（初期非表示、15秒ごとに枠連と自動切替）
            session3 修正: クラス名をデザイン design.zip 準拠の `frame-umatan` に統一
             （旧 `frame-utan` は style.css に対応 CSS が無く崩れの原因だったため）。
           ID `frame-utan` / `frameUtanWrapper` は JS 参照のため変更しない。 -->
      <div class="frame-umatan" id="frame-utan" style="display:none;">
        <div class="frame-umatan__head"><div>枠単</div></div>
        <div class="frame-umatan__wrapper" id="frameUtanWrapper"></div>
      </div>
    </div>
  </div>
</div>

<!-- カットインDOM（templates/cutin.html）は common.js の ensureCutinTemplate が起動時に fetch して body 末尾に挿入する -->

<script>
(function() {
  var D = window.OddsDemo;
  // カットインテンプレートを起動時に取得（fire-and-forget、失敗時は checkCutin/showCutin の DOM存在チェックで安全にスキップ）
  D.ensureCutinTemplate();
  var dataUrl = null;
  var currentPoller = null;   // 指示書07: setInterval 方式から指数バックオフ付き poller に変更
  var lastData = null;
  var serverOffsetMs = 0;

  // 枠連↔枠単ローテーション（H-03）の現在ページ。
  //   親からの frameOddsPage 通知で更新し、再描画時も applyFramePage でこの状態を再適用する。
  //   従来は再描画のたびに枠連を無条件表示に戻していたため、枠単の表示中にポーリングが走ると
  //   両ブロックが同時に並び、枠単が画面外へ押し出されて点滅して見えた。
  var framePage = 'uren';   // 'uren'（枠連）| 'utan'（枠単）

  // dp2: **枠連／枠単は出さない。**
  //   デザイン CSS が `.fullname .screen .race-main { grid-template-columns: 1fr }` と
  //   `.fullname .screen .frame-odds { display:none }` で 1 カラムに畳んでいるため、
  //   H-03 のローテで display を書き戻すと枠だけ復活してレイアウトが崩れる。
  //   表示制御はここに集約されているので、ここで常に隠す。
  //   ⚠ DOM と描画処理そのものは残してある（消すと null 参照になる箇所が多い）。
  //     隠れた DOM に書き込む無駄はあるが、single-screen.html との差分を小さく保つ方を採った。
  function applyFramePage() {
    var urenEl = document.getElementById('frame-uren');
    var utanEl = document.getElementById('frame-utan');
    if (urenEl) urenEl.style.display = 'none';
    if (utanEl) utanEl.style.display = 'none';
  }

  // 枠連ブロックの3カラム配置
  var FRAME_LAYOUT = [
    [1, 6, 7], [2, 5, 8], [3, 4]
  ];

  // O-8 : 枠連の発売最小頭数。8頭以下は枠連の発売がない。
  //   prod 実データで裏付け済み: 7/24 全36レースで 8頭以下は frame_odds が全て空、
  //   9頭以上は全て満件（9頭=29 / 10頭=30 / 12頭=32 / 16頭=36）。
  //   7/29 も他レースに票が入っている時間帯に園田10R（7頭）だけが空だった。
  var FRAME_QUINELLA_MIN_HORSES = 9;

  function render(data) {
    var race = data.race || {};
    var horses = data.horses || [];

    lastData = data;
    document.getElementById('screen').style.setProperty('--horse-count', horses.length);
    D.renderRaceHeader(document, race, { mode: 'full', correctedNowMs: Date.now() + serverOffsetMs });

    var body = document.getElementById('horseBody');
    // dp2: ばんえいは「斤量」ではなく「重量」で、減量記号の減算も行わない。
    //   common.js に判定の export が無いため entries-results-3r.html と同じ式を使う。
    var isBanei = (race && race.organizer_type === 'NAR' && race.place_cd === '03');

    var horseFragment = document.createDocumentFragment();
    horses.forEach(function(h) {
      // 指示書08: 取消馬（is_scratched=1 出走取消 / =2 競走除外）
      //   - 行全体に row-scratched を付与（CSSで opacity 0.5）
      //   - 単勝/複勝オッズ欄を「取消」/「除外」ラベルに差替
      //   - 馬番・枠番・馬名・馬体重・騎手名は通常表示（opacityで薄くなる）
      var isScratched = !!h.is_scratched;
      var rowClasses = 'race-table__row ' + D.frameClassOf(h.frame_no, 'row');
      if (isScratched) rowClasses += ' row-scratched';
      var row = D.el('div', rowClasses);
      row.appendChild(D.el('div', 'race-table__frame', h.frame_no));
      row.appendChild(D.el('div', 'race-table__number', h.horse_no));

      var name = D.el('div', 'race-table__name', h.horse_name);
      name.style.setProperty('--name-length', (h.horse_name || '').length);
      row.appendChild(name);

      if (isScratched) {
        // 指示書08 v2: 単勝+複勝セルを結合した1セル「出走取消」/「競走除外」
        // grid-column: span 2 で単勝・複勝領域を1セルで占有（dos-overrides.css）。
        row.appendChild(D.el('div', 'race-table__scratched', D.scratchedLabel(h.is_scratched)));
      } else {
        // O-3b : 票が入っていない馬は win_odds / place_odds が null で配信される。
        //   従来は空欄になっていたため、他画面と同じく '-' を出す。
        // O-3: 配色は桁数ベース（値なしのときは色を付けない）
        var org = race.organizer_type;
        row.appendChild(D.el('div', D.oddsClass('race-table__odds-win', h.win_odds, 'win', org), D.fmtOddsOr(h.win_odds, 'win', org)));
        // O-3b 追補: 複勝は min - max の 3 span 構成。両方欠損なら '-' 1 個にまとめる
        row.appendChild(D.fillMinMaxCell(D.el('div', 'race-table__odds-place'),
          h.place_odds_min, h.place_odds_max, 'place', org));
      }

      var weight = D.el('div', 'race-table__weight');
      // 特殊値・計量前（null）対応（馬体重特殊値仕様書 §4.5、D.fmtWeight/fmtWeightDiff）
      var wTxt = D.fmtWeight(h.weight);
      var wVal = D.el('span', null, wTxt);
      if (/^\d{4,}$/.test(wTxt)) wVal.classList.add('weight-long');
      weight.appendChild(wVal);
      // dp2: 増減は デザイン §6.7 の DOM に合わせる。
      //   <span class="weight-diff weight-diff--plus">(<span class="weight-diff__paren">)</span>…
      //   括弧だけ白、数値はプラス赤 / マイナス青。日本語（計不 等）は --text。
      weight.appendChild(buildWeightDiff(h));
      row.appendChild(weight);

      // dp2: 斤量。減量記号ぶんを差し引いた実負担重量（entries-results-3r と同じ扱い）。
      // 小数第1位まで出す（"53" → "53.0"）。
      //   デザイン screen1-fullname.html:55 が "53.0"、entries-results-3r も toFixed(1) で、
      //   dp2 だけ String(fwt) だったため整数に見えていた（PROD 実機で担当が発見）。
      //   ばんえいは整数（重量）なので entries-results-3r と同じく Math.round。
      var fwt = D.effectiveFwt(h, isBanei);
      var fwtStr = '';
      if (fwt !== null && fwt !== undefined) {
        fwtStr = isBanei ? String(Math.round(fwt)) : Number(fwt).toFixed(1);
      }
      row.appendChild(D.el('div', 'race-table__assigned-weight', fwtStr));

      // dp2: 騎手名は**切り詰めない**（この画面の存在理由）。
      //   NAR は姓名をスペースで桁揃えするので、空白だけ落とす。
      row.appendChild(D.el('div', 'race-table__jockey',
                           String(h.jockey || '').replace(/[\s\u3000]+/g, '')));
      horseFragment.appendChild(row);
    });
    body.replaceChildren(horseFragment);

    // 枠連ブロック
    // 枠連発売なし（frame_odds 空＝8頭未満等）のときはブロックごと非表示にする。
    //   従来は枠番 1〜8 のラベルだけが並んで表示されていた（STG 実データ 名古屋3R 7頭で顕在化）。
    // O-8 : 発売有無の判定を frame_odds.length から出走頭数へ変更。
    //   frame_odds.length では「枠連の発売なし（8頭以下）」と「発売前で1票も入っていない」を
    //   区別できず、発売前の 9頭以上レースでもブロックごと消えていた（門別・川崎で確認）。
    var frameOddsData = data.frame_odds || [];
    var urenAvailable = horses.length >= FRAME_QUINELLA_MIN_HORSES;
    var urenWrap = document.getElementById('frame-uren');
    if (urenWrap) {
      // frameOddsPage（枠連↔枠単ローテ）ハンドラが display を上書きするため、発売有無を保持
      urenWrap.dataset.frameOddsAvailable = urenAvailable ? '1' : '0';
    }
    // ここで枠連を無条件に表示へ戻していたため、枠単の表示中に再描画が走ると
    //   枠連が復活して両ブロックが同時に並び、枠単が画面外へ押し出されていた
    //   （18頭立てサンプルで「枠単」の文字が点滅する事象）。
    //   ローテーションの現在ページを保持し、再描画時もそれを尊重する。
    applyFramePage();
    var frameOddsMap = {};
    frameOddsData.forEach(function(e) { frameOddsMap[e.frame_a + '-' + e.frame_b] = e; });

    // O-8: 行の生成は horses[] の枠構成から決める（frame_odds の有無では決めない）。
    //   票が入っていない組合せは配信 JSON に要素ごと存在しないため、従来はその行が
    //   消えて下の組合せが繰り上がっていた（NRS 取引先・NAR 瀧本様からの問合せ
    //   、園田1R の 1-6 / 1-7）。
    //   枠の頭数は取消馬も含めた全馬で数える。prod 実データ（7/29 名古屋2R、枠7の
    //   1頭が取消）でも同枠組合せ 7-7 が配信されており、バッチ側も全馬基準のため。
    var frameCount = {};
    horses.forEach(function(h) {
      var f = h.frame_no;
      if (f >= 1 && f <= 8) frameCount[f] = (frameCount[f] || 0) + 1;
    });

    var foBody = document.getElementById('frameOddsBody');
    var foFragment = document.createDocumentFragment();
    // 発売なし（8頭以下）のときはブロックごと非表示なので中身も作らない
    if (urenAvailable) FRAME_LAYOUT.forEach(function(col) {
      var colEl = D.el('div', 'frame-odds__col');
      col.forEach(function(frameA) {
        var block = D.el('div', 'frame-odds__block ' + D.frameClassOf(frameA, 'block'));
        block.appendChild(D.el('div', 'frame-odds__label', frameA));
        for (var frameB = frameA; frameB <= 8; frameB++) {
          // 出走馬のいない枠は組合せ自体が存在しない（JSON構造仕様書 §4.6）
          if (!frameCount[frameA] || !frameCount[frameB]) continue;
          // O-8b ( 決定): 同枠が成立しない枠（その枠が1頭）でも行は出す。
          //   NAR 公式のオッズページは 8枠×8枠の三角マトリクスを常に固定表示し、
          //   成立しない同枠（1-1〜4-4 等）を「-」で埋める。NRS・NAR 様が公式サイトと
          //   見比べるため表示規約を揃える。枠連発売レースは必ず 8 枠すべてに馬がいる
          //   （9頭以上・鳩の巣原理）ので、常に 36 行固定になりレイアウトも安定する。
          //   配信 JSON 側は §4.6 どおり同枠2頭未満の要素を出さないため、ここは
          //   entry なし＝「-」として扱われる。
          var entry = frameOddsMap[frameA + '-' + frameB];
          var item = D.el('div', 'frame-odds__item');
          item.appendChild(D.el('div', 'frame-odds__number', frameB));
          // O-3: 配色は桁数ベース / O-3b: 未着の組合せは行を残して '-'
          var valCls = entry
            ? D.oddsClass('frame-odds__value', entry.odds, 'frame_quinella', race.organizer_type)
            : 'frame-odds__value';
          item.appendChild(D.el('div', valCls,
            entry ? D.fmtOddsOr(entry.odds, 'frame_quinella', race.organizer_type) : D.ODDS_EMPTY));
          block.appendChild(item);
        }
        colEl.appendChild(block);
      });
      foFragment.appendChild(colEl);
    });
    foBody.replaceChildren(foFragment);

    // H-03 : 枠単マトリクス描画
    //   race.frame_utan（同枠2頭以上のみ同枠あり、最大64件）があれば描画。
    //   初期は display:none のため画面には出ない。
    //   親 index.html から postMessage {type:'frameOddsPage', page:'utan'} で表示切替。
    //   発売なし（utanData.length===0）時は親にも通知してページング停止させる。
    var utanData = race.frame_utan || [];
    var utanWrapper = document.getElementById('frameUtanWrapper');
    if (utanData.length > 0) {
      D.renderFrameUtan(utanData, utanWrapper, race.organizer_type);
    } else if (utanWrapper) {
      utanWrapper.replaceChildren();  // 発売なし時に前レースの描画を消す
    }
    // H-03 ( 改訂): 枠単発売有無を親に通知。親はページング停止/再開を判断。
    if (window.parent !== window) {
      try {
        window.parent.postMessage({
          type: 'frameUtanAvailability',
          url: dataUrl,
          available: utanData.length > 0
        }, '*');
      } catch (_) {}
    }
  }

  // 指示書07: 指数バックオフ付きポーリング。失敗時は render を呼ばず既存表示を維持。
  //  serverOffsetMs は毎 poll で res.serverOffset に更新する。
  //   旧コメントは「親から受け取った初回固定 offset を使う」と書いていたが、実際には
  //   **どこにも代入が無く 0 のまま**で、renderRaceHeader / checkCutin / startHeaderTicker の
  //   3経路すべてが端末時計そのままだった（PC の時刻ズレが締切表示にそのまま出る）。
  //   「毎 poll だと静的 server_time にスナップして進まない」という旧来の懸念は
  //   server_time-fix-v3  で解消済み。offset は HTTP Date+Age 由来の**差分**なので
  //   再計算しても値はほぼ不変で、poll 間も Date.now が進む。毎回更新するほうが時計ドリフトに強い。
  function startPolling() {
    if (currentPoller) currentPoller.stop();
    currentPoller = D.startResilientPolling({
      name: 'single-screen',
      baseIntervalMs: D.pollInterval,
      fetch: function() {
        if (!dataUrl) return Promise.reject(new Error('dataUrl not set'));
        return D.fetchWithOffset(dataUrl);
      },
      onSuccess: function(res) {
        // render より前に代入する（render 内の renderRaceHeader が既に使う）
        serverOffsetMs = res.serverOffset || 0;
        render(res.data);
        D.checkCutin(res.data.race, Date.now() + serverOffsetMs);
        if (window.parent !== window) {
          window.parent.postMessage({
            type: 'childServerTime',
            url: dataUrl,
            serverTime: res.data.server_time,
            offset: res.serverOffset
          }, '*');
        }
      }
    });
    D.registerPoller(currentPoller);
  }

  window.addEventListener('message', function(e) {
    var d = e.data;
    if (!d) return;
    if (d.type === 'setDataUrl') {
      dataUrl = d.url;
      // server_time-fix-v3 : 親からの baseOffset 撤去（setServerOffset に一本化）。
      //   serverOffsetMs は onSuccess: res.serverOffset 経由で更新される（fetchWithOffset 内で
      //   親 broadcast 優先、未受信時は Date+Age ヘッダから算出）。
      startPolling();
    } else if (d.type === 'frameOddsPage') {
      // H-03 : 親から枠連・枠単の切替通知を受信
      //   d.page: 'uren'（枠連）| 'utan'（枠単）
      // 表示制御は applyFramePage に一本化（再描画時も同じ状態を再適用するため）。
      //    の「枠連発売なし時は 'uren' 指示でも表示しない」ガードも同関数内で継続。
      framePage = (d.page === 'utan') ? 'utan' : 'uren';
      applyFramePage();
    }
  });

  // 1秒tick でヘッダー deadline を更新（realtime countdown）
  // dp2: 馬体重の増減セルを デザイン DOM で組む。
  //   fmtWeightDiff は '(+9)' / '(-4)' / '(初)' / '(前計不)' / '' を返す。
  //   括弧を span で分け、符号つき数値のときだけ色クラスを付ける。
  function buildWeightDiff(h) {
    var txt = D.fmtWeightDiff(h.weight_diff, h.wt2, h.weight);
    var span = D.el('span', 'weight-diff');
    if (!txt) return span;
    var m = /^\((.*)\)$/.exec(txt);
    var inner = m ? m[1] : txt;
    var sign = /^[+-]?\d+$/.test(inner);
    if (sign) {
      span.classList.add(inner.charAt(0) === '-' ? 'weight-diff--minus' : 'weight-diff--plus');
    } else {
      span.classList.add('weight-diff--text');   // 「初」「前計不」など日本語
    }
    if (m) span.appendChild(D.el('span', 'weight-diff__paren', '('));
    span.appendChild(document.createTextNode(inner));
    if (m) span.appendChild(D.el('span', 'weight-diff__paren', ')'));
    return span;
  }

  D.startHeaderTicker(function() {
    return { doc: document, data: lastData, mode: 'full', serverOffsetMs: serverOffsetMs };
  });
})();
</script>
</body>
</html>
