<!DOCTYPE html>
<html lang="ja" class="screen-4k">
<head>
  <meta charset="UTF-8">
  <title>出走成績（4K用・4分割×6R横並び）</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- 4K出走成績（display_pattern 60/61/62）。デザイン screen8.html 6/6 最終版（9646a1c）準拠。
       §8.8: html.screen-4k、.wrapper を 2×2 の4分割にし各クアドラントに .six-race（6R横並び）を配置。
       .six-race は 192rem×108rem＝50vw×50vh のため 4 ブロックで 4K 全面を埋める。
       本プロト: 親から受け取った races[] を 6 件ずつブロック化し、最大4ブロック（左上/右上/左下/右下）
       を描画。運用想定（PL確認 ）= 左列=1場目(上1-6R/下7-12R)、右列=2場目(上1-6R/下7-12R)。
       払戻は §8.8.1: --single(1カラム)/--grid/--grid+--pattern-E を dead_heat_pattern で選択。
       クラスは公式 style.css の .six-race__* / num-* / row-* / diff を使用（style.css は改変しない）。 -->
  <link rel="stylesheet" href="../assets/css/style.css?v=20260829a">
  <link rel="stylesheet" href="../assets/css/dos-overrides.css?v=20260829a">
  <script src="../assets/js/common.js?v=20260829a"></script>
</head>
<body>

<div class="wrapper" id="wrapper"></div>

<script>
(function() {
  var D = window.OddsDemo;
  var RESULTS_POLL_INTERVAL_MS = 30000;  // v0.5 §7.2（30秒）
  var COLS_PER_BLOCK = 6;
  var MAX_BLOCKS = 4;                     // 2×2（4分割）

  var BET_TYPE_LABEL = {
    win: '単勝', place: '複勝', frame_quinella: '枠連', frame_exacta: '枠単',
    quinella: '馬連', exacta: '馬単', wide: 'ワイド', trio: '3連複', trifecta: '3連単'
  };
  var BET_TYPE_ORDER = [
    ['win','win'], ['place','place'], ['frame_quinella','wakuren'], ['frame_exacta','wakutan'],
    ['quinella','umaren'], ['exacta','umatan'], ['wide','wide'], ['trio','trio'], ['trifecta','trifecta']
  ];
  var NUM_CLASS = {
    1:'num-white', 2:'num-black', 3:'num-red', 4:'num-blue',
    5:'num-yellow', 6:'num-green', 7:'num-orange', 8:'num-pink'
  };
  var GENRYO_ICON = { '★':'fill-star', '▲':'fill-triangle', '△':'triangle', '☆':'star', '◇':'diamond' };

  // O-4/O-5 ( デザイン打合せ AI#10/#11、 担当確定)
  //   減量記号の凡例は「ばんえい（帯広）のときだけ」出す。
  //   ばんえい時に出すのは、従来カッコ書きだった 2 記号（△20Kg減 / ☆10Kg減）のみ。
  //   通常競馬の 5 記号（★4 / ▲3 / △2 / ◇2 / ☆1）は出さない。
  //   非ばんえい時は中身を空にするだけで、外側の .six-race__legend は残す
  //   （幅・高さを占有しており display:none にするとブロックのレイアウトがずれるため）。
  //   判定単位はブロック（6 列＝1 場）。ブロック内に 1 件でもばんえいがあれば出す。
  //   4K で 2 場並ぶとき、帯広のブロックにだけ凡例が出る。
  //   ブロック構築時点ではデータ未取得のため、まず空で挿入し、各列の描画後に
  //   renderLegends が中身を流し込む。
  var LEGEND_HTML = '<div class="six-race__legend"><div class="six-race__legend-inner"></div></div>';

  var BANEI_LEGEND_INNER = ''
    + '<div class="six-race__legend-item">騎手に付く記号</div>'
    + '<div class="six-race__legend-item"><img class="six-race__legend-icon" src="../assets/images/info/triangle.svg" alt=""><span class="six-race__legend-text"><span>20Kg</span>減</span></div>'
    + '<div class="six-race__legend-item"><img class="six-race__legend-icon" src="../assets/images/info/star.svg" alt=""><span class="six-race__legend-text"><span>10Kg</span>減</span></div>';

  // 列インデックス → ばんえいか。COLS_PER_BLOCK ごとにブロックへ集約する。
  var colIsBanei = [];

  function setColBanei(idx, data) {
    colIsBanei[idx] = isBanei(data || {});
    renderLegends();
  }

  function renderLegends() {
    var blocks = document.querySelectorAll('.six-race');
    for (var b = 0; b < blocks.length; b++) {
      var inner = blocks[b].querySelector('.six-race__legend-inner');
      if (!inner) continue;
      var show = false;
      for (var c = 0; c < COLS_PER_BLOCK; c++) {
        if (colIsBanei[b * COLS_PER_BLOCK + c]) { show = true; break; }
      }
      inner.innerHTML = show ? BANEI_LEGEND_INNER : '';
    }
  }

  function esc(s) { return String(s == null ? '' : s); }
  function nameLen(s) { return (s || '').length; }
  function isBanei(d) {
    var org = d.organizer_type || (d.race && d.race.organizer_type);
    var pp  = d.place_cd       || (d.race && d.race.place_cd);
    return org === 'NAR' && pp === '03';
  }
  function formatAmount(n) { return (n == null) ? '-' : Number(n).toLocaleString('ja-JP'); }
  // 払戻額の桁数クラス（デザイン 申し送り仕様書 §6.6 / §7.2、keiba-odds 28a1aeb 取込）。
  //   7桁 → --long（2.4rem） / 8桁 → --xlong（2.1rem）。
  //   ⚠ 桁数は**カンマを除いた整数の桁数**で数える（`515,560` は 6 桁）。
  //   ⚠ CSS 定義は 1カラム（`.six-race__payout--single`）向けだが、
  //     §6.6 の注記どおり**グリッド型でも HTML 側でクラスを付与する**。
  //   🔴 style.css からは `:has(.six-race__payout-num .hyphen)` のレイアウト指定が
  //     削除され、桁対応はこのクラス方式に置き換わった。**クラスを出さないと縮まない。**
  function payoutDigitClass(n) {
    if (n === null || n === undefined || isNaN(Number(n))) return '';
    var d = String(Math.floor(Math.abs(Number(n)))).length;
    if (d >= 8) return 'six-race__payout-price--xlong';
    if (d === 7) return 'six-race__payout-price--long';
    return '';
  }
  function decodeBitmap(bm) {
    var out = []; if (!bm) return out;
    for (var i = 0; i < bm.length; i++) if (bm[i] === '1') out.push(i + 1);
    return out;
  }

  // ---- ヘッダー ----
  function buildHeader(data, mode) {
    var venue = data.place_name || (data.race && data.race.place_name) || '';
    var rr    = data.rr || (data.race && data.race.rr) || '';
    var right = (mode === 'results')
      ? '<div class="six-race__header-title">競走成績</div>'
      : '<div class="six-race__header-time"><span>発走</span><span class="minute">'
        + esc(data.post_time || (data.race && data.race.post_time) || '--:--') + '</span></div>';
    return '<div class="six-race__header">'
         + '<div class="six-race__header-name">' + esc(venue)
         +   '<span class="six-race__race-number">' + esc(rr) + '<span>R</span></span></div>'
         + right + '</div>';
  }

  // ---- 競走成績 ----
  //  着差の表示。**実データは全角・空白なし**（`２１／２` `１１／４` `３／４`）。
  //   旧実装 M-2 はデザイン原版のサンプル（**半角** `1 1/2`）に合わせた `split(' ')` で、
  //   **実データに空白が無いため一度も分岐していなかった**（`.time-int`/`.time-frac` の CSS も無かった）。
  //   結果、全角4字＝実質8字ぶんが枠に収まらず**隣の馬名側へ食い込んでいた**
  //   （実測  / 3r: 必要 128px・使える 96px。`overflow` 指定も無い）。
  //   🔴 **デザイン FB 対応デザイン（4K）に合わせ、半角へ変換して `1 1/2` の形で出す**
  //      （ 決定）。整数部と分数部の間に**半角空白**を入れることで
  //      「２１／２ が 21/2（21分の2）に読める」誤読（画面仕様書 §3-5）も解消する。
  //      ⚠ 一度は「全角のまま分数部を 0.6em で小さく」実装したが、**小さすぎて視認性が悪い**
  //        （8/18 担当確認）。デザイン正本どおり **同じ文字サイズの半角**にする。
  //   ⚠ 同じ関数が entries-results-3r.html と entries-results-6r.html の**両方**にある。
  //     片方だけ直すと 4K(6R) 側に残る（HANDOFF 追記(8) と同じ轍）。
  //   分数を持たないもの（クビ／アタマ／ハナ／大差）はそのまま出す（カタカナ・漢字は全角が正）。
  var MARGIN_ZEN2HAN = { '０':'0','１':'1','２':'2','３':'3','４':'4',
                         '５':'5','６':'6','７':'7','８':'8','９':'9','／':'/' };
  function normalizeMargin(s) {
    var out = s.replace(/[０-９／]/g, function(c) { return MARGIN_ZEN2HAN[c]; });
    // 主催者で着差の書き方が違う（2026-08-29 に PROD 実データ 588 件で確認）。
    //   NAR  `１１／２`    全角・区切りなし・単位なし
    //   JRA  `1.1/2馬身`  半角・ピリオド区切り・単位つき
    // 画面の表記を `1 1/2` に揃える（芥川デザイン準拠）。
    //
    // 1) 単位「馬身」を落とす。
    //    JRA だけ単位が付くため、NAR と並ぶと不揃いになるうえ、
    //    `1. 1/2馬身` は当初設計の桁を超えて枠からはみ出す。
    //    🔴 はみ出しを overflow:hidden で隠すのは禁止。整数部が消えて誤読になる。
    //    「馬身」は必ず末尾（実データ 19 種すべて）。文字系（クビ/ハナ/アタマ/大差）には付かない。
    out = out.replace(/馬身$/, '');
    // 2) JRA のピリオドを空白に直す。これをしないと `1. 1/2` になる。
    out = out.replace(/(\d)\.(\d\/\d)/, '$1 $2');
    // `21/2` → `2 1/2`。分母・分子は1桁なので、`/` の1つ前から分数部が始まる。
    //   既に空白がある（半角データ・JRA を直したあと）ときは触らない。
    var i = out.indexOf('/');
    if (i >= 2 && out.indexOf(' ') < 0) out = out.slice(0, i - 1) + ' ' + out.slice(i - 1);
    return out;
  }
  function renderMarginOrTime(e) {
    if (e.time) return esc(e.time);
    if (!e.margin_name) return '';
    return esc(normalizeMargin(String(e.margin_name)));
  }
  function buildRecord(entries) {
    var html = '<div class="six-race__record">';
    (entries || []).forEach(function(e) {
      html += '<div class="six-race__record-row">'
            + '<div class="six-race__record-rank">' + esc(e.rank) + '</div>'
            + '<div class="six-race__record-num ' + (NUM_CLASS[e.frame_no] || '') + '">' + esc(e.horse_no) + '</div>'
            + '<div class="six-race__record-name" style="--name-length: ' + nameLen(e.horse_name) + ';">' + esc(e.horse_name) + '</div>'
            + '<div class="six-race__record-time">' + renderMarginOrTime(e) + '</div>'
            + '</div>';
    });
    return html + '</div>';
  }

  // ---- 払戻（§8.8.1 パターン選択） ----
  function comboHtml(combination) {
    return String(combination == null ? '' : combination).split('-').map(function(n, i) {
      return (i > 0 ? '<span class="hyphen">-</span>' : '') + esc(n);
    }).join('');
  }
  function buildPayoutGroup(betType, mod, items) {
    var itemsHtml = items.map(function(p) {
      var numHtml;
      // 返還は複勝も combination="0" で来るため place 分岐より先に判定する。
      if (p.is_void) {
        numHtml = '<div class="six-race__payout-num">−</div>';
      } else if (betType === 'place' && p.place_label) {
        numHtml = '<div class="six-race__payout-num six-race__payout-num--rank">'
                + '<span class="rank-label">' + String(p.place_label).replace('着', '<span>着</span>') + '</span>'
                + '<span class="rank-num">' + esc(p.combination) + '</span></div>';
      } else {
        numHtml = '<div class="six-race__payout-num">' + comboHtml(p.combination) + '</div>';
      }
      // 返還・特払のラベル付与（3R 版 buildPayoutPrice と同じ扱い）。
      //   返還はレース不成立で全賭式が元返しになるケース。金額だけ出すと
      //   「0番が100円で的中」に見えるため明示する。
      var priceCls = p.is_void ? ' is-void' : (p.is_special_pay ? ' is-special-pay' : '');
      var payoutDg = payoutDigitClass(p.amount);
      if (payoutDg) priceCls += ' ' + payoutDg;
      var priceLbl = p.is_void ? '<span class="six-race__payout-void-label">返還</span>'
                   : (p.is_special_pay ? '<span class="six-race__payout-special-label">特払</span>' : '');
      return '<div class="six-race__payout-item">' + numHtml
           + '<div class="six-race__payout-price' + priceCls + '">' + priceLbl
           + formatAmount(p.amount) + '<span>円</span></div></div>';
    }).join('');
    return '<div class="six-race__payout-group six-race__payout-group--' + mod + '">'
         + '<div class="six-race__payout-type">' + (BET_TYPE_LABEL[betType] || betType) + '</div>'
         + '<div class="six-race__payout-items">' + itemsHtml + '</div></div>';
  }
  function buildRefundFooter(refund) {
    if (!refund) return '';
    var h = decodeBitmap(refund.horse_no_bitmap), b = decodeBitmap(refund.bracket_no_bitmap);
    var sb = refund.same_bracket_bitmap ? decodeBitmap(refund.same_bracket_bitmap) : [];
    if (!h.length && !b.length && !sb.length) return '';
    var rows = '';
    if (h.length)  rows += '<div>返還馬番 <span>' + h.join(',') + '</span></div>';
    if (b.length)  rows += '<div>返還枠番 <span>' + b.join(',') + '</span></div>';
    if (sb.length) rows += '<div>返還同枠 <span>' + sb.join(',') + '</span></div>';
    return '<div class="six-race__payout-footer"><div class="six-race__refund-label">返還</div>'
         + '<div class="six-race__refund-list">' + rows + '</div></div>';
  }
  // §8.8.1: dead_heat_pattern で払戻レイアウトを選択。
  //   E=--grid+--pattern-E（券種グループ min-height 調整必須） / NORMAL=--single(1カラム) / 他=--grid。
  //   （デザイン screen8 サンプルは画面位置×R で固定実演だが、実データは dead_heat_pattern 駆動）
  function payoutLayoutClasses(pattern) {
    if (pattern === 'E') return { wrap: 'six-race__payout--grid', stack: ' --pattern-E' };
    if (!pattern || pattern === 'NORMAL') return { wrap: 'six-race__payout--single', stack: '' };
    return { wrap: 'six-race__payout--grid', stack: '' };
  }
  function buildPayout(payouts, refund, pattern) {
    payouts = payouts || {};
    var groups = '';
    BET_TYPE_ORDER.forEach(function(pair) {
      var items = payouts[pair[0]] || [];
      if (items.length) groups += buildPayoutGroup(pair[0], pair[1], items);
    });
    var cls = payoutLayoutClasses(pattern);
    return '<div class="six-race__payout ' + cls.wrap + '">'
         + '<div class="six-race__payout-stack' + cls.stack + '">' + groups + '</div>'
         + buildRefundFooter(refund) + '</div>';
  }

  // ---- 出走表 ----
  // 特殊値・計量前対応（馬体重特殊値仕様書 §4.5）。
  //   「(計不)」は weight=9999 専用表示のため、diff=null（計量前等）では空にする
  function formatWeightDiff(diff, wt2, weight) {
    if (weight == null || weight === 0 || weight === 9999) return '';
    if (wt2 === 0) return '<span class="diff">(初)</span>';
    if (wt2 === 9999) return '<span class="diff">(前計不)</span>';
    if (diff == null) return '';
    return '<span class="diff">(' + (diff > 0 ? '+' : '') + diff + ')</span>';
  }
  function buildHorseTable(horses) {
    horses = horses || [];
    var html = '<div class="six-race__horse-table">'
             + '<div class="six-race__horse-table-head"><div>枠</div><div>番</div>'
             +   '<div class="six-race__horse-table-head--grid"><span class="six-race__horse-table-head--name">馬名</span>'
             +     '<div><span>馬体重</span><span>騎手名</span></div></div></div>'
             + '<div class="six-race__horse-table-body">';
    var order = [], groups = {};
    horses.forEach(function(h) {
      var f = h.frame_no || 0;
      if (!groups[f]) { groups[f] = []; order.push(f); }
      groups[f].push(h);
    });
    order.forEach(function(f) {
      var rowCls = D.frameClassOf ? D.frameClassOf(f, 'row') : '';
      html += '<div class="six-race__horse-group ' + rowCls + '">'
            + '<div class="six-race__horse-frame">' + esc(f) + '</div><div class="six-race__horse-rows">';
      groups[f].forEach(function(h) {
        var scratched = h.is_scratched === 1 || h.is_scratched === 2;
        html += '<div class="six-race__horse-row' + (scratched ? ' row-scratched' : '') + '">'
              + '<div class="six-race__horse-num">' + esc(h.horse_no) + '</div>'
              + '<div class="six-race__horse-detail">'
              +   '<div class="six-race__horse-name" style="--name-length: ' + nameLen(h.horse_name) + ';">' + esc(h.horse_name) + '</div>';
        if (scratched) {
          html += '<div class="six-race__horse-meta"><div class="six-race__horse-weight">'
                + (h.is_scratched === 1 ? '出走取消' : '競走除外') + '</div></div>';
        } else {
          // odds JSON の horses[] は org_genryokigo / new_genryokigo（§3 系）。
          //   `genryokigo`（§4.5.4 系）のみ参照していたため出走表で記号が出なかった。
          var gen6 = D.genryokigoOf ? D.genryokigoOf(h) : h.genryokigo;
          var icon = (gen6 && GENRYO_ICON[gen6])
            ? '<img class="jockey-icon" src="../assets/images/jockey/' + GENRYO_ICON[gen6] + '.svg" alt="">' : '';
          html += '<div class="six-race__horse-meta">'
                +   '<div class="six-race__horse-weight">' + D.fmtWeight(h.weight) + formatWeightDiff(h.weight_diff, h.wt2, h.weight) + '</div>'
                // 騎手名を D.truncateJockey に通す（single-screen.html /
                //   entries-results-3r.html と同じルール）。未適用だと JRA データで省略切れする。
                //   JRA-DB の騎手名は姓名を固定長で埋めるため全角スペースが 5〜6 個入り
                //   （例「舟山　　　　　　瑠泉」）、その幅で枠を超えていた（8/1 JRA 実データで検出）。
                +   '<div class="six-race__horse-jockey">' + icon + esc(D.truncateJockey(h.jockey)) + '</div></div>';
        }
        html += '</div></div>';
      });
      html += '</div></div>';
    });
    return html + '</div></div>';
  }

  function buildCancelled(data) {
    return '<div class="six-race__body"><div class="six-race__cancelled">'
         + ((data.odds_status === 2) ? 'レース中止' : '開催中止') + '</div></div>';
  }

  // ---- カラム描画 ----
  function colEl(idx) { return document.querySelector('[data-col-idx="' + idx + '"]'); }
  function renderResultsMode(idx, data) {
    var col = colEl(idx); if (!col) return;
    setColBanei(idx, data);
    if (data.odds_status === 2 || data.odds_status === 3) {
      col.innerHTML = buildHeader(data, 'results') + buildCancelled(data); return;
    }
    if ((data.entries || []).length) col.style.setProperty('--horse-count', data.entries.length);
    col.innerHTML = buildHeader(data, 'results')
      + '<div class="six-race__body">' + buildRecord(data.entries)
      +   buildPayout(data.payouts, data.refund, data.dead_heat_pattern) + '</div>';
  }
  function renderEntriesMode(idx, data) {
    var col = colEl(idx); if (!col) return;
    var race = data.race || {};
    setColBanei(idx, race);
    if (race.odds_status === 2 || race.odds_status === 3) {
      col.innerHTML = buildHeader(race, 'entries') + buildCancelled(race); return;
    }
    var horses = data.horses || [];
    // O-1 : 従来は `if (horses.length)` ガードで、horses が空のとき
    //   前レースの --horse-count が残っていた。既定 10（ブレイクポイント）に落とす。
    col.style.setProperty('--horse-count', horses.length || 10);
    col.innerHTML = buildHeader(race, 'entries')
      + '<div class="six-race__body">' + buildHorseTable(horses) + '</div>';
  }

  // ---- 4分割ブロック構築 ----
  // races[] を 6 件ずつブロック化し、最大4ブロック（.six-race）を .wrapper に描画。
  //   各ブロック = 6 列（.six-race__col）+ 凡例。col には全体通し番号 data-col-idx を付与。
  var builtBlocks = -1;   // いま DOM に組んであるブロック数（再構築の要否判定に使う）

  function buildBlocks(raceCount) {
    var wrapper = document.getElementById('wrapper');
    var blocks = Math.min(MAX_BLOCKS, Math.max(1, Math.ceil(raceCount / COLS_PER_BLOCK)));
    // ページ送りのちらつき対策（売場  の dp60 対応で顕在化）。
    //   従来は message を受けるたび wrapper.innerHTML='' で全消しし、空の列枠を作ってから
    //   各列が非同期 fetch で埋まるのを待っていたため、切替の瞬間に画面が白く抜けた。
    //   3R 版（entries-results-3r.html）は列 DOM を保持したまま col.innerHTML を
    //   差し替えるだけなのでちらつかない。**同じ挙動に揃える。**
    //   ⚠ 判定はレース件数ではなく **ブロック数** で行う。
    //   列は常に blocks × COLS_PER_BLOCK 本作られるため、件数が変わっても
    //   ブロック数が同じなら DOM は作り直さなくてよい。
    //   件数で比較していた版では、**12R 開催でない場（金沢は10R）だけ**
    //   1-6R(6件) → 7-10R(4件) で件数が変わって再構築が走り、
    //   その場だけちらつく状態になっていた（ STG 実機の録画で確認）。
    if (builtBlocks === blocks
        && wrapper.querySelectorAll('.six-race').length === blocks) {
      // 使われない列（例: 金沢 7-10R のときの 11R/12R 枠）は明示的に空にする。
      //   DOM を保持する以上、消さないと前ページ（5R/6R）の内容が残ってしまう。
      var keep = wrapper.querySelectorAll('.six-race__col');
      for (var k = raceCount; k < keep.length; k++) {
        keep[k].innerHTML = '';
        colIsBanei[k] = false;
      }
      renderLegends();
      applyBlockScale(blocks);
      return;
    }
    wrapper.innerHTML = '';
    colIsBanei = [];   // O-4/O-5: ブロック再構築で前回の判定を捨てる
    builtBlocks = blocks;
    var idx = 0;
    for (var b = 0; b < blocks; b++) {
      var cols = '';
      for (var c = 0; c < COLS_PER_BLOCK; c++, idx++) {
        cols += '<div class="six-race__col" data-col-idx="' + idx + '"></div>';
      }
      wrapper.insertAdjacentHTML('beforeend',
        '<div class="six-race"><div class="six-race__cols">' + cols + '</div>' + LEGEND_HTML + '</div>');
    }
    applyBlockScale(blocks);
  }

  // ブロック数に応じて描画スケールを合わせる（決定）。
  //   style.css はデザインアセットのため改変せず、:root の font-size と wrapper の
  //   grid 定義のみをインラインで上書きする。
  //   背景: `html.screen-4k` は `font-size: 0.2604166667vw`（1rem = 幅の 0.2604%）で、
  //   `.six-race` は `192rem × 108rem` = 常に「viewport の 50% × 50%」になる。
  //   これは 4 ブロック（2場×1-12R）で 4K 全面を埋める前提の値。
  //   dp61/dp62（6R 固定 = 1 ブロック）を 4 分割の 1 コマに割り当てると、
  //   コマの左上 1/4 にしか描画されない（幅 50% × 高さ 50%）。
  //   iframe 内の vw はその iframe 自身が基準のため、コマが小さくても比率は変わらない。
  //   対処: 1 ブロックのときは 192rem = 100vw となるよう font-size を 2 倍にし、
  //   wrapper を 1×1 グリッドにしてコマ全体を使う。16:9 なら高さも 108rem = 56.25vw
  //   = 100% となり歪みなく収まる。2 ブロック以上は従来どおり（2×2 前提）。
  function applyBlockScale(blocks) {
    var root = document.documentElement;
    var wrapper = document.getElementById('wrapper');
    if (blocks === 1) {
      root.style.fontSize = (100 / 192) + 'vw';   // 192rem = 100vw
      wrapper.style.gridTemplateColumns = '1fr';
      wrapper.style.gridTemplateRows = '1fr';
    } else {
      root.style.fontSize = '';                   // style.css の既定に戻す
      wrapper.style.gridTemplateColumns = '';
      wrapper.style.gridTemplateRows = '';
    }
  }

  // ---- fetch（results → odds フォールバック）+ ポーリング ----
  var raceUrls = [];
  async function pollRaceColumn(idx) {
    var urls = raceUrls[idx];
    if (!urls) return;
    try {
      var res = await D.fetchWithOffset(urls.resultsUrl);
      // 確定前の空 results（entries=[]）では成績モードに入らない（3r と同旨）
      // 返還レースは entries が永久に空のままなので、着順の有無だけで判定すると
      //   いつまでも出走表が出続ける（3R 版と同じ扱い）。
      if (res && res.data
          && ((Array.isArray(res.data.entries) && res.data.entries.length > 0)
              || D.isVoidRace(res.data.payouts))) { renderResultsMode(idx, res.data); return; }
    } catch (e) { /* 404 → 出走表へ */ }
    try {
      var res2 = await D.fetchWithOffset(urls.oddsUrl);
      if (res2 && res2.data) { renderEntriesMode(idx, res2.data); return; }
    } catch (e2) { console.warn('[entries-results-6r] both fetches failed col=' + idx, e2); }
  }

  window.addEventListener('message', function(e) {
    if (!e.data) return;
    if (e.data.type === 'setEntriesResults6r' || e.data.type === 'setEntriesResults3r') {
      var races = (e.data.races || []).slice(0, COLS_PER_BLOCK * MAX_BLOCKS); // 最大24
      buildBlocks(races.length);
      raceUrls = races.map(function(r) {
        // data_source が odds/ 形式（バッチ）でも results を試せるよう双方向導出
        var base = r.url || '';
        return { resultsUrl: base.replace('/odds/', '/results/'),
                 oddsUrl: base.replace('/results/', '/odds/') };
      });
      raceUrls.forEach(function(_, i) { pollRaceColumn(i); });
    }
  });

  setInterval(function() {
    raceUrls.forEach(function(_, i) { if (raceUrls[i]) pollRaceColumn(i); });
  }, RESULTS_POLL_INTERVAL_MS);
})();
</script>

</body>
</html>
