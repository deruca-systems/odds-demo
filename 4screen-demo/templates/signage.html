<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>サイネージ（全画面）</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- サイネージ（display_pattern 110）。分割の全面にサイネージ画像を表示する。
       （売場 「中止などでサイネージだけ出したい」）。
       J-WEB と同じ考え方で「画面の種類のひとつ」として扱い、画面選択でこれだけを
       選べばサイネージが出続ける。他の画面と混ぜればローテーションに入る。

       画像 URL の取得（ 調査）:
         - 親から postMessage('setSignageUrl') で受け取る（カットイン CUT-003 と共通経路）
         - 親は screen.signage_url / slot.signage_url を解決して送る
         - 本番 JSON への signage_url 追加はバッチへ依頼中。
           それまで prod では signage_id しか出ないため画像は出ない（背景色のみ）
         - S3 実体: dos-signage/{signage_id 6桁}/{時刻}JST_{元ファイル名}
           ファイル名が導出できないため signage_id からは URL を組み立てられない

       レースは表示しないため races[] は参照しない。 -->
  <link rel="stylesheet" href="../assets/css/style.css?v=20260825c">
  <link rel="stylesheet" href="../assets/css/dos-overrides.css?v=20260825c">
  <script src="../assets/js/common.js?v=20260825c"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
    .signage {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }
    /* 縦横比を保って収める。余白は背景色（JSON構造仕様書 §3.5.5.3 案）。 */
    .signage__image {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      display: block;
    }
    .signage__image.is-hidden { display: none; }
  </style>
</head>
<body>

<div class="signage" id="signage">
  <img class="signage__image is-hidden" id="signage-image" src="" alt="">
</div>

<script>
(function() {
  var D = window.OddsDemo;
  var imgEl = document.getElementById('signage-image');
  var current = null;

  function show(url) {
    if (!url) {
      // 画像が無い場合は何も出さない（背景色のみ）。エラー表示はしない。
      //   JSON構造仕様書 §3.5.5.3: signage_url が null のときは背景色のみ。
      imgEl.classList.add('is-hidden');
      imgEl.removeAttribute('src');
      current = null;
      return;
    }
    if (url === current) return;   // 同じ URL の再設定では再読込しない（ちらつき防止）
    current = url;
    imgEl.onerror = function() {
      // 404 等。画面を割らずに背景色へフォールバックする。
      console.warn('[signage] 画像を取得できませんでした: ' + url);
      imgEl.classList.add('is-hidden');
    };
    imgEl.onload = function() { imgEl.classList.remove('is-hidden'); };
    imgEl.src = url;
  }

  // 親から setSignageUrl を受ける（カットイン CUT-003 と同じ経路）。
  //   common.js 側のリスナーは cutinState に保持するだけで公開もされていないため、
  //   本テンプレは独自に受け取る。
  //   タイミング: 親は iframe.onload で送信し、本スクリプトはパース時に実行される
  //   （= onload より前にリスナー登録が完了する）ため取りこぼさない。
  //   親は signage_url が null のとき送信自体を行わない → 画像なし＝背景色のみ。
  window.addEventListener('message', function(e) {
    if (!e.data) return;
    if (e.data.type === 'setSignageUrl') {
      show(e.data.url || null);
    }
    // 親は setDataUrl も送ってくるが、サイネージはレースを参照しないため無視する。
  });
})();
</script>

</body>
</html>
