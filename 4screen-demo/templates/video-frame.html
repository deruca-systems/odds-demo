<!DOCTYPE html>
<!--
  指示書09 T3: 動画表示専用テンプレート（4分割/1画面/L字 共通）。
  親から postMessage({type:'setVideoConfig', ...}) を受け取り hls.js で HLS ライブ再生する。
  オッズJSONのポーリングは一切行わない。
-->
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>動画フレーム</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- === BEGIN: TECH-VERIFICATION-ONLY === -->
  <!-- 権利処理未完了。本番実装時は NAR との商用利用契約後に正式URLを設定すること。
       hls.js CDN も契約CDN/自社バンドルに差し替える。 -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <!-- === END: TECH-VERIFICATION-ONLY === -->
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
    video {
      width: 100%; height: 100%;
      object-fit: contain; background: #000;
      display: block;
    }
    /* C-05 (2026-04-17): 仕様書§4 px禁止ルール遵守のため font-size を vw/vh 比例化。
     * FHD (1920×1080): min(13.44px, 12.96px) = 12.96px（旧12px相当）
     * 4K  (3840×2160): min(26.88px, 25.92px) = 25.92px（比例拡大）
     * 1280×720       : min(8.96px,  8.64px)  = 8.64px（小画面で縮小、デバッグ用途のため許容）
     * status はデバッグ情報のため小さめ係数。本番切替時は削除予定（TECH_VERIFICATION_NOTES.md 参照）。*/
    .status {
      position: fixed; left: 0.5rem; bottom: 0.5rem;
      color: #888; font-size: min(0.7vw, 1.2vh); font-family: monospace;
      pointer-events: none;
      /* 2026-07-14: デバッグ表示のため既定は非表示。親からの setVideoConfig の
         debug=true（親 URL の ?debug=1）のときのみ .visible 付与で表示する。 */
      display: none;
    }
    .status.visible { display: block; }
    .status.error { color: #FF5252; }
  </style>
</head>
<body>
  <video id="live" autoplay muted playsinline></video>
  <div class="status" id="status">待機中…</div>

  <script>
  (function() {
    var videoEl = document.getElementById('live');
    var statusEl = document.getElementById('status');
    var hls = null;
    var currentSource = null;
    var audioWanted = false;  // 直近 config が音声ON（audio_muted=false）を要求しているか

    /* ------------------------------------------------------------------
     * 2026-08-14: 映像だけ止まる事象への対処（ISH-26 / TAC-07 / TAC-12 / 8/3 事象①）
     *
     * 症状: オッズは進むのにレース映像が待機画面のまま／途中で張り付く。リロードで復帰。
     *       とくに「実況が始まる前に動画画面を設定しておくと、実況が始まっても始まらない」。
     *
     * 原因: 動画 URL は会場単位（buildVideoUrl は venue_code から組む）で、当回が変わっても
     *       変化しない。そのため親からの setVideoConfig 再送は「同一 source」で素通りする。
     *       それ自体は正しい（当回ごとに張り替えると映像が途切れる）が、
     *       **一度止まったプレイヤーを起こす仕組みがどこにも無かった**。
     *         ・fatal な HLS エラーでもメッセージを出すだけで復帰しない
     *         ・再生位置が進んでいないことを誰も監視していない
     *       中央（GCH）側 gch-video-frame.js には fatal 復帰と定期ポーリングがあり、
     *       報告4件がすべて地方であることと符合する。
     *
     * 対処: ①fatal エラーからの復帰（hls.js 標準の startLoad / recoverMediaError）
     *       ②再生位置の停滞監視。止まっていたら張り直す
     *       いずれも指数バックオフ付き。無人運用のため「諦めない」ことを優先する。
     * ------------------------------------------------------------------ */
    var WATCHDOG_INTERVAL_MS = 3000;   // 監視周期
    var STALL_LIMIT_MS       = 15000;  // これだけ進まなければ停滞とみなす
    var BACKOFF_MIN_MS       = 2000;
    var BACKOFF_MAX_MS       = 30000;
    var lastCfg       = null;   // 直近の設定（張り直しに使う）
    var lastTime      = -1;
    var lastProgressAt = 0;
    var recoverCount  = 0;
    var recoverTimer  = null;
    var backoffMs     = BACKOFF_MIN_MS;

    function nowMs() { return new Date().getTime(); }

    /** 再接続を予約する。連続失敗時はバックオフを伸ばす。 */
    function scheduleRecover(reason) {
      if (recoverTimer || !lastCfg) return;
      recoverCount++;
      var waitSec = Math.round(backoffMs / 1000);
      console.warn('[video-frame] 再接続を予約 #' + recoverCount + ' 理由=' + reason + ' ' + waitSec + '秒後');
      setStatus('再接続待ち(' + recoverCount + ') ' + reason + ' → ' + waitSec + '秒後', true);
      recoverTimer = setTimeout(function() {
        recoverTimer = null;
        backoffMs = Math.min(backoffMs * 2, BACKOFF_MAX_MS);
        // 同一 source 判定を外して必ず張り直す
        currentSource = null;
        // -1 で初期化すると、張り直し直後の初回監視で currentTime(0) と食い違い
        // 「進行した」と誤判定してバックオフが伸びない。実値で初期化すること。
        lastTime = videoEl.currentTime;
        lastProgressAt = nowMs();
        applyConfig(lastCfg);
      }, backoffMs);
    }

    // 再生位置が進んでいるかを見張る。events ではなく実測値をポーリングする
    // （stalled/waiting は発火しないまま止まることがあるため）。
    setInterval(function() {
      if (!currentSource || recoverTimer) return;
      var t = videoEl.currentTime;
      if (t !== lastTime) {
        lastTime = t;
        lastProgressAt = nowMs();
        if (backoffMs !== BACKOFF_MIN_MS) {
          backoffMs = BACKOFF_MIN_MS;   // 正常に進んだらバックオフを戻す
          console.info('[video-frame] 再生が進行。バックオフを初期化');
        }
        return;
      }
      if (!lastProgressAt) { lastProgressAt = nowMs(); return; }
      var stalled = nowMs() - lastProgressAt;
      if (stalled >= STALL_LIMIT_MS) {
        scheduleRecover('停滞 ' + Math.round(stalled / 1000) + '秒');
      }
    }, WATCHDOG_INTERVAL_MS);

    function setStatus(text, isError) {
      if (!statusEl) return;
      statusEl.textContent = text;
      statusEl.classList.toggle('error', !!isError);
    }

    /**
     * 再生開始（Autoplay Policy フォールバック付き）。
     * 音声ON（muted=false）での play() がポリシーによりブロックされた場合は
     * ミュートに切り替えて再生を開始する（映像を止めないことを優先）。
     * 表示端末は起動フラグで音声ON自動再生を許可する運用（2026-07-14 方針）。
     */
    function tryPlay() {
      videoEl.play().catch(function() {
        if (!videoEl.muted) {
          videoEl.muted = true;
          setStatus('自動再生ポリシーによりミュートで開始（動画クリックで音声ON）');
          videoEl.play().catch(function(){});
        }
      });
    }

    /**
     * ミュートフォールバック後の音声復帰。
     * ユーザー操作（この iframe 内のクリック/キー入力）はブラウザの user activation を
     * 発生させるため、音声ONが要求されている（audioWanted）のにミュート中なら解除する。
     * ※親ページ側のクリックでは activation が iframe に伝播しないため、動画自体を
     *   クリックしてもらう必要がある。表示端末は起動フラグで最初から音声ONのため不要。
     */
    function gestureUnmute() {
      if (audioWanted && videoEl.muted) {
        videoEl.muted = false;
        videoEl.play().catch(function(){});
        setStatus('ユーザー操作により音声ON');
      }
    }
    window.addEventListener('pointerdown', gestureUnmute);
    window.addEventListener('keydown', gestureUnmute);

    // === BEGIN: TECH-VERIFICATION-ONLY ===
    /**
     * 動画設定を適用する（親からの setVideoConfig 受信時に呼ばれる）。
     * 同じ video_source なら再ロードしない（継続再生）。quality_cap / volume / muted は都度反映。
     */
    function applyConfig(cfg) {
      if (!cfg) return;
      lastCfg = cfg;   // 停滞・エラーからの張り直しに使う
      var videoSource = cfg.video_source;
      var qualityMode = cfg.quality_mode || 'auto';
      var qualityCap  = cfg.quality_cap != null ? Number(cfg.quality_cap) : null;
      // 2026-07-14 方針: 音声はデフォルトで出力（未指定時 muted=false）。
      //   表示端末は起動フラグ --autoplay-policy=no-user-gesture-required で許可する運用。
      //   ポリシー未許可のブラウザでは tryPlay() がミュート開始へフォールバックする。
      var audioMuted  = cfg.audio_muted != null ? !!cfg.audio_muted : false;
      var volume      = cfg.volume != null ? Number(cfg.volume) : 0.7;
      audioWanted = !audioMuted;
      // デバッグ時のみステータス表示（親 URL の ?debug=1 を setVideoConfig 経由で受領）
      if (statusEl) statusEl.classList.toggle('visible', !!cfg.debug);

      // audio / volume は常に反映
      videoEl.muted = audioMuted;
      videoEl.volume = Math.max(0, Math.min(1, volume));

      if (!videoSource) {
        setStatus('video_source 未指定', true);
        return;
      }

      // 同じ source なら再ロードせず、quality_cap のみ適用
      if (videoSource === currentSource && hls) {
        if (qualityMode === 'auto' && qualityCap != null) {
          hls.autoLevelCapping = qualityCap - 1; // 1-indexed → 0-indexed
        } else if (qualityMode === 'fixed') {
          hls.autoLevelCapping = -1;
        }
        setStatus('設定更新: cap=' + qualityCap + ' muted=' + audioMuted);
        return;
      }

      // 新規 source: hls.js 再起動
      if (hls) {
        try { hls.destroy(); } catch (_) {}
        hls = null;
      }
      currentSource = videoSource;
      // -1 で初期化すると、張り直し直後の初回監視で currentTime(0) と食い違い
      // 「進行した」と誤判定してバックオフが伸びない。実値で初期化すること。
      lastTime = videoEl.currentTime;
      lastProgressAt = nowMs();   // 張り直し直後に即・停滞判定されないようにする

      if (window.Hls && Hls.isSupported()) {
        hls = new Hls({
          maxMaxBufferLength: 10,   // ライブ配信向けに短めバッファ
          liveDurationInfinity: true
        });
        hls.loadSource(videoSource);
        hls.attachMedia(videoEl);
        hls.on(Hls.Events.MANIFEST_PARSED, function() {
          if (qualityMode === 'auto' && qualityCap != null) {
            hls.autoLevelCapping = qualityCap - 1;
          }
          setStatus('再生開始 ' + (videoSource.split('/').pop()));
          tryPlay();
        });
        // 2026-08-14: fatal を放置していたため一度落ちると永久に復帰しなかった。
        //   hls.js 標準の復帰手順を踏み、それでも駄目なら張り直しを予約する。
        hls.on(Hls.Events.ERROR, function(event, data) {
          if (!data) return;
          if (!data.fatal) {
            console.debug('[video-frame] hls warn', data.details);
            return;
          }
          console.error('[video-frame] hls fatal', data.type, data.details);
          if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
            try {
              hls.startLoad();
              setStatus('通信エラー: 再読込中（' + data.details + '）', true);
              return;
            } catch (_) {}
          } else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
            try {
              hls.recoverMediaError();
              setStatus('再生エラー: 復旧中（' + data.details + '）', true);
              return;
            } catch (_) {}
          }
          scheduleRecover('HLS ' + (data.details || data.type));
        });
      } else if (videoEl.canPlayType('application/vnd.apple.mpegurl')) {
        // iOS Safari など HLS ネイティブサポート
        videoEl.src = videoSource;
        videoEl.addEventListener('loadedmetadata', function() {
          setStatus('ネイティブHLS再生 ' + videoSource.split('/').pop());
          tryPlay();
        });
      } else {
        setStatus('HLS 非対応ブラウザ', true);
      }
    }
    // === END: TECH-VERIFICATION-ONLY ===

    window.addEventListener('message', function(e) {
      var d = e.data;
      if (d && d.type === 'setVideoConfig') {
        applyConfig(d);
      }
    });
  })();
  </script>
</body>
</html>
