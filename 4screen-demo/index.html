<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #000; color: #e6edf3;
    font-family: "Yu Gothic UI", sans-serif;
    overflow: hidden;
  }
  /* 2026-06-04: 芥川 style.css L82 (html.single-screen) と同スケールを親フレームにも適用。
   * これで .grid.layout-3split の gap や info-bar 等を「芥川と同じ rem 単位」で書け、

  .grid {

  /* === 4分割レイアウト === */
  /* 2026-05-01: CRM 設計（手動画面切替の田の字 1/3 上段・2/4 下段）と整合させ
     column-major に固定。プロジェクト当初指示と一致。
     P1=左上, P2=左下, P3=右上, P4=右下。

  .grid.layout-4split .cell-1 { grid-column: 1; grid-row: 1; }  /* 左上 */
  .grid.layout-4split .cell-2 { grid-column: 1; grid-row: 2; }  /* 左下 */
  .grid.layout-4split .cell-3 { grid-column: 2; grid-row: 1; }  /* 右上 */

  /* === 1画面レイアウト（指示書09 T1） === */

    grid-template-columns: 1fr;
    grid-template-rows: 1fr;

  .grid.layout-1screen .cell-1 { grid-row: 1; grid-column: 1; }
  .grid.layout-1screen .cell-2,
  .grid.layout-1screen .cell-3,

  /* === L字レイアウト 3分割（指示書09 T1 / 2026-04-16 仕様書§4 準拠版） ===
   *   設計思想:
   *     - 仕様書§4「px禁止・rem基本・FHD/4K比例拡縮」に準拠。
   *     - monitor=0101（.screen）の vw/vh min() スケーリングと同じ思想を踏襲。
   *     - cell1 は画面幅 22% 固定比率。FHD 1920 → 422px、4K 3840 → 845px、1280 → 281px。
   *     - cell2 は aspect-ratio: 16/9 で幅から高さ自動決定。常に 16:9 を保証。
   *     - cell3 は残り高さ。
   *   これでビューポートサイズが変わっても全 cell が比例拡縮する。 */
  .grid.layout-3split {
    grid-template-columns: 20% 1fr;     /* 2026-04-17: 22%→20% に切り上げ（ユーザー要望） */
    grid-template-rows: auto 1fr;
    /* 2026-06-04: 芥川 screen7.html style.css L3050 の .message { gap: 0.4rem } と整合。
     *   親 html に同スケール (1rem = min(1.04vw, 1.85vh)) を適用したので 0.4rem で直接記述可能。
     *   FHD で 8px、4K で 16px に比例拡縮。.grid background: #000 で黒い区切りとして表示。 */
    gap: 0.4rem;
  }
  .grid.layout-3split .cell-1 { grid-row: 1 / 3; grid-column: 1; }
  .grid.layout-3split .cell-2 {
    grid-row: 1;
    grid-column: 2;
    aspect-ratio: 16 / 9;
    max-height: 100%;
  }
  .grid.layout-3split .cell-3 { grid-row: 2; grid-column: 2; }
  .grid.layout-3split .cell-4 { display: none; }

  .cell__badge {

    padding: 0 0.3rem; font-size: 0.65rem;
    z-index: 1; pointer-events: none;

<script>
(function() {
  // ---- 設定（すぐ変えられる位置にまとめる） ----
  // C-01 (2026-04-17): 本番デフォルト30秒（全画面リスト v1.0【3/10確定事項】「オッズ画面更新頻度：30秒」）。
  //   ?fast=1 付与時のみ 10秒 に短縮（デモ用モード、スロット短縮版と同時連動）。
  //   ?schedule_poll=N / ?odds_poll=N が個別上書き（最優先）。
  // H-04 (2026-04-17): NEXT_RACE_DELAY_SEC 追加（発走時刻+N秒で次レース自動遷移）。
  //   デフォルト60秒（= 締切+180秒、J-WEB準拠）、?fast=1 で 5秒、?next_race_sec=N で上書き可。
  var SCHEDULE_POLL_SEC = 30;   // スケジュールJSONポーリング（秒、本番デフォルト）
  var ODDS_POLL_SEC     = 30;   // 子テンプレのオッズJSONポーリング（秒、本番デフォルト）
  var NEXT_RACE_DELAY_SEC = 60; // 発走時刻+N秒で次レース遷移（H-04 Phase 1 §1 合意値。timer モード時のみ使用）
  // 2026-07-30: 当回レースの切替トリガ（7/28 お披露目会FB 課題整理 §5-1 ／ 及川決定）。
  //   'payout' … 当該レースの**払戻が配信されたら**次レースへ（既定）
  //   'timer'  … 発走時刻+NEXT_RACE_DELAY_SEC で次レースへ（従来動作。デモ・検証用）
  //
  //   prod 実測（2026-07-30・NAR 4場 全48レース／`当回レース切替タイミング_実測_20260730.md`）:
  //     ① results JSON の出現 … 発走+1.1分（中央値）だが **中身は空**。判定に使えない
  //     ② 払戻の充填          … 発走+8.3分（中央値、範囲 +6.8〜+30.1）← ここで切替
  //     ③ 着順の充填          … 発走+14.4分（中央値、範囲 +11.1〜+33.7）
  //   ③まで待つと最大 33 分オッズが残るため、目的（終わったレースのオッズを出し続けない）には②で足りる。
  var RACE_ADVANCE_MODE = 'payout';
  var NEXT_RACE_FALLBACK_SEC = 35 * 60; // 払戻が来ないとき（中止・欠損）の強制遷移。実測最大 30.1 分 + 余裕
  var RESULT_CHECK_INTERVAL_MS = 30000; // results JSON の確認間隔（レース単位。確定したら以後叩かない）
  // 起動時の初期レース選択に使う「払戻がまだ来ていないとみなす」時間。
  //   ここは**中央値ではなく実測の最大寄り**に取る。理由は誤りの非対称性:
  //     短すぎる → 未確定のレースを飛ばす。遷移は前進のみなので**復帰できない**
  //     長すぎる → 確定済みの古いレースを掴むが、払戻チェックが即座に確定を検知して前進する。
  //                各レースの初回チェックはスロットル対象外なので 1 秒に 1 レースずつ収束する
  //   実測（2026-07-30・48レース）の払戻到着は +6.8〜+30.1 分。最大側をカバーする。
  var PAYOUT_ETA_SEC = 32 * 60;
  // 起動時の先読み（prefetchPayoutProbes）の上限と待ち時間。
  //   PAYOUT_ETA_SEC を最大寄りに取った代償で「確定済みの前レースを掴む」のは避けられないが、
  //   **描画前に**払戻を確認しておけば往復が画面に出ない。
  var PAYOUT_PREFETCH_MAX = 6;          // 1 区画あたりに先読みするレース数の上限
  var PAYOUT_PREFETCH_TIMEOUT_MS = 1500; // 通信が詰まっても描画は止めない
  var FRAME_UTAN_PAGE_SEC = 15; // H-03: single-screen.html で 枠連↔枠単 を自動切替する間隔（秒）
  var SLOT_TICK_SEC     = 5;    // 時間帯切替の検査間隔（秒）- 1秒tickではなく5秒で十分
  var DISPLAY_TICK_SEC  = 1;    // 情報バー表示更新（秒）。サーバ負荷には関与しない。

  // URLクエリで上書き可能:
  //   ?schedule_poll=5   スケジュールpoll秒（最優先）
  //   ?odds_poll=5       オッズpoll秒（最優先）
  //   ?next_race_sec=5   次レース遷移秒（最優先）
  //   ?monitor=101       端末番号（INT、既定 101。path-date-folder 2026-04-20 で 0101→101）
  //   ?display_date=20260420 開催日（YYYYMMDD、任意、未指定時は端末時刻の暦日）
  //                          後方互換: ?date=20260420 でも可（display_date 優先）
  //   ?fast=1            デモ用モード: 短縮スケジュール版 + ポーリング10秒 + 次レース遷移5秒
  var USE_FAST = false;
  (function applyQuery() {
    var q = new URL(location.href).searchParams;
    if (q.get('fast') === '1' || q.get('fast') === 'true') {
      USE_FAST = true;
      // C-01: fast=1 連動でポーリングも10秒（デモ実演用）
      SCHEDULE_POLL_SEC = 10;
      ODDS_POLL_SEC = 10;
      // H-04 Phase 1 §9.4 案F1: fast=1 で次レース遷移秒も 5秒に短縮
      NEXT_RACE_DELAY_SEC = 5;
    }
    // 個別上書きは fast=1 連動より優先
    var sp = Number(q.get('schedule_poll'));
    var op = Number(q.get('odds_poll'));
    var nr = Number(q.get('next_race_sec'));
    if (isFinite(sp) && sp >= 1) SCHEDULE_POLL_SEC = sp;
    if (isFinite(op) && op >= 1) ODDS_POLL_SEC = op;
    if (isFinite(nr) && nr >= 1) NEXT_RACE_DELAY_SEC = nr;
    // 2026-07-30: 切替トリガの選択。
    //   ?fast=1 と ?next_race_sec=N は「秒で送る」意図なので timer モードに落とす
    //   （デモ用フィクスチャには払戻が無く、payout モードでは進まないため）。
    if (USE_FAST || (isFinite(nr) && nr >= 1)) RACE_ADVANCE_MODE = 'timer';
    var adv = q.get('advance');
    if (adv === 'timer' || adv === 'payout') RACE_ADVANCE_MODE = adv;   // 明示指定が最優先
    var fb = Number(q.get('fallback_sec'));   // 検証用: フェイルセーフまでの秒数
    if (isFinite(fb) && fb >= 1) NEXT_RACE_FALLBACK_SEC = fb;
  })();

  // H-04 Phase 1 §9.2 案P1採用: position 文字列 "P1"-"P4" を iframe 番号に対応付け
  var POSITION_TO_FRAME_NUM = { 'P1': 1, 'P2': 2, 'P3': 3, 'P4': 4 };

  function positionToFrameNum(pos) {
    return POSITION_TO_FRAME_NUM[pos];
  }
  function getIframeByPosition(pos) {
    var n = positionToFrameNum(pos);
    return n ? document.getElementById('frame' + n) : null;
  }

  // === BEGIN: v0.6.3 dual-read 後方互換 (2026-06-02) ===
  // 内山さんCRM/バッチの v0.6.3 形式（slot.layout_pattern / screen.layout_section="01".."04" /
  // screen.display_pattern_id のみ）と、プロト gen_data.py の旧形式（slot.layout /
  // screen.position="P1".."P4" / screen.template 直指定）の両方を読めるようにする。
  // 両データ源が混在してもよい。本番で内山さん形式へ一本化された後に簡素化可能。

  // layout_section / position のどちらでも frame 番号(1..4)へ解決。
  //   受理する値: "01".."04" / "1".."4" / "P1".."P4"（大小問わず）。
  function sectionToFrameNum(v) {
    if (v == null) return undefined;
    var s = String(v).trim().toUpperCase();
    if (POSITION_TO_FRAME_NUM[s]) return POSITION_TO_FRAME_NUM[s];   // P1..P4
    var n = parseInt(s, 10);                                          // "01".."04" / "1".."4"
    if (isFinite(n) && n >= 1 && n <= 4) return n;
    return undefined;
  }

  // screen から正規化済み position("P1".."P4")を得る（layout_section 優先、無ければ position）。
  //   以降の下流コード（getIframeByPosition / s.position==='P1' 等）は従来どおり "P1".."P4" で動く。
  function resolveCanonicalPosition(screen) {
    var raw = (screen.layout_section != null) ? screen.layout_section : screen.position;
    var n = sectionToFrameNum(raw);
    return n ? ('P' + n) : null;
  }

  // display_pattern_id → テンプレパス（内山さん形式で template が無い場合に使用）。
  //   2026-06-29: display_pattern マスタ整理（display_patternマスタ整理一覧_20260623.md §1）
  //   に追従し、**screen 単位の新ID** へ全面移行。screen.display_pattern_id を引く。
  //   ★確認済: 1 = 単勝・複勝・枠連・枠単（SCR-ODD-001、2026-06-02 STG 実機検証）。
  var DISPLAY_PATTERN_ID_TO_TEMPLATE = {
    1:   'templates/single-screen.html',          // ★単勝・複勝・枠連・枠単（SCR-ODD-001）
    // 2026-08-19: 騎手名フルネーム版（芥川様 screen1-fullname / keiba-odds 28a1aeb）。
    //   dp1 に対し 斤量列＋馬体重増減の赤青＋騎手名フル、枠連／枠単は出さない。
    2:   'templates/single-screen-fullname.html',
    // 馬連・ワイド（自動ページング/固定P1-P3）。テンプレ側でページ制御
    10:  'templates/single-umaren-wide.html',
    11:  'templates/single-umaren-wide.html',
    12:  'templates/single-umaren-wide.html',
    13:  'templates/single-umaren-wide.html',
    // 2026-08-16 (ISH-25): 馬連・馬単・人気順の first/second を1枚に統合した。
    //   自動ページング(20/30/40)も固定(21/22/31/32/41/42)も**同じテンプレ**を使い、
    //   ページは ?page=N（固定）または postMessage setOddsPage（ローテ）で指定する。
    //   iframe.src が変わらないので**ページ送りで再読込されない＝暗転しない**。
    // 馬連（マトリクス）
    20:  'templates/single-umaren.html',
    21:  'templates/single-umaren.html',
    22:  'templates/single-umaren.html',
    // 馬単（マトリクス）
    30:  'templates/single-umatan.html',
    31:  'templates/single-umatan.html',
    32:  'templates/single-umatan.html',
    // 人気順
    40:  'templates/single-popular.html',
    41:  'templates/single-popular.html',
    42:  'templates/single-popular.html',
    // 出走成績（3R 系: 自動ページング/固定範囲）
    50:  'templates/entries-results-3r.html',
    51:  'templates/entries-results-3r.html',
    52:  'templates/entries-results-3r.html',
    53:  'templates/entries-results-3r.html',
    54:  'templates/entries-results-3r.html',
    // 出走成績（4K 用 6R 系: 自動ページング/固定範囲）
    60:  'templates/entries-results-6r.html',
    61:  'templates/entries-results-6r.html',
    62:  'templates/entries-results-6r.html',
    // 変更情報
    70:  'templates/changes-info.html',
    // 動画（NAR=80 / JRA GCH ch1-5=90-94）。いずれも video-frame.html（ch/場は screen 側設定）
    80:  'templates/video-frame.html',

  // server_time-fix-v3 (2026-04-20): HTTP Date + Age ヘッダから serverOffset を毎 fetch 再計算、
  //   全子 iframe へ broadcast する中央集権型同期方式に刷新。
  //   - { cache: 'no-cache' } でブラウザキャッシュ再検証を強制（If-None-Match 付与、304 応答可）
  //   - ?t= クエリは撤去（CloudFront CachingOptimized のキャッシュキー同一性を享受）
  //   - data.server_time は補正に使用しない（監査用途でフィールド自体は継続出力）
  //   - Date 欠落時は serverOffset=0、Age 欠落時は Age=0 として扱う
  async function fetchSchedule() {
    var t0 = Date.now();
    var controller = new AbortController();
    var timer = setTimeout(function() { controller.abort(); }, 10000);
    try {
      var res = await fetch(SCHEDULE_URL, {
        signal: controller.signal,
        cache: 'no-cache'
      });
      if (!res.ok) throw new Error('schedule HTTP ' + res.status);
      var data = await res.json();
      var t1 = Date.now();
      var clientTime = t0 + (t1 - t0) / 2;

      // HTTP Date + Age から serverOffset 算出（CloudFront キャッシュ経由でも正確）
      var dateHeader = res.headers.get('Date');
      if (dateHeader) {
        var dateMs = Date.parse(dateHeader);
        if (!isNaN(dateMs)) {
          var ageSec = Number(res.headers.get('Age')) || 0;
          var serverNow = dateMs + ageSec * 1000;
          serverOffset = serverNow - clientTime;
          // 全子 iframe に broadcast（定期更新）
          broadcastServerOffsetToChildren();
        }
      }
      // Date ヘッダ欠落時は serverOffset を更新しない（前回値 or 初期値 0 を維持）
      return data;
    } finally {
      clearTimeout(timer);
    }
  }

      var holdSec = (RACE_ADVANCE_MODE === 'payout') ? PAYOUT_ETA_SEC : NEXT_RACE_DELAY_SEC;
      var displayEndMs = postMs + holdSec * 1000;
      if (now < displayEndMs) {
        // 🔴 2026-08-19: 払戻が既に来ているレースは掴まない。
        //   PAYOUT_ETA_SEC(32分) は実測**最大**寄りの見積りなので、払戻が中央値
        //   (+8.3分) で来ていると確定済みの前レースを掴む。従来はその 1〜2 秒後に

  // 2026-06-29: venue_filters（§3.13）の target_race_no_list を rr の集合述語に変換。
  //   null / '' / '1-12' → 全レース true。'7-12' 範囲、'10,11' 個別、'1,3,5-7' 混合に対応。
  function makeRaceNoPredicate(listStr) {
    if (listStr == null || listStr === '' || listStr === '1-12') return function() { return true; };
    var allowed = {};
