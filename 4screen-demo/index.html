        allowed[Number(tok)] = true;
      }
    });
    return function(rr) { return !!allowed[rr]; };
  }

  // race_id 'NAR_45_03' → {organizer_type, place_cd, rr}。失敗時 null。
  function parseRaceId(raceId) {
    if (!raceId || typeof raceId !== 'string') return null;
    var p = raceId.split('_');
    if (p.length < 3) return null;
    var rr = parseInt(p[2], 10);
    if (isNaN(rr)) return null;
    return { organizer_type: p[0], place_cd: p[1], rr: rr };
  }

  // 2026-06-29: venue_filters（§3.13）で発売対象外レースを除外する。
  //   venue_filters 省略/空配列 → 全発売（races そのまま）。
  //   リストに無い開催場のレース → 除外（その売場では売らない）。
  // 2026-07-30: data_source のパス中の {YYYYMMDD} を offset 日ぶん進める（§3.5.4 前日発売）。
  //   例: odds/20260730/NAR_21_01.json + offset 1 → odds/20260731/NAR_21_01.json
  //   日付が見つからない/offset が 0 のときは元の値をそのまま返す。
  function shiftDataSourceDate(dataSource, offset) {
    if (!dataSource || !offset) return dataSource;
    return dataSource.replace(/\/(\d{8})\//, function(_m, ymd) {
      var d = new Date(+ymd.slice(0, 4), +ymd.slice(4, 6) - 1, +ymd.slice(6, 8));
      if (isNaN(d.getTime())) return _m;
      d.setDate(d.getDate() + offset);
      var pad = function(n) { return (n < 10 ? '0' : '') + n; };
      return '/' + d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) + '/';
    });
  }

  function applyVenueFilters(races, venueFilters) {
    if (!venueFilters || !venueFilters.length) return races;
    return races.filter(function(race) {
      var info = parseRaceId(race.race_id);
      if (!info) return true; // パース不能は安全側で残す
      var vf = null;
      for (var i = 0; i < venueFilters.length; i++) {
        if (venueFilters[i].place_cd === info.place_cd
         && venueFilters[i].organizer_type === info.organizer_type) { vf = venueFilters[i]; break; }
      }
      if (!vf) return false; // リスト外の場 → 非発売
      return makeRaceNoPredicate(vf.target_race_no_list)(info.rr);
    });
  }

  // === BEGIN: v0.6.7 pages[] 同一区画ローテーション (2026-08-18) ===
  //   JSON構造仕様書 v0.6.7 §3.5.2.2 / スケジュールJSON出力PG設計書 v1.8 §6.4.7。
  //   CRM「画面選択1〜4」は **同一区画（layout_section）内で最大4つを順に切り替える**設定だが、
  //   JSON に器が無く `_01` だけが出ていた（引地様 確認表 №30/№31）。v0.6.7 で
  //   `screens[].pages[]` が新設され、内山様 v1.8 が STG に反映済み。
  //     ・`pages` があればそれを順に切り替え、無ければ **直下フィールドを1件**として扱う（dual-read）
  //     ・`pages` が 1 件のときはローテ tick を回さない ＝ **従来と完全に同じ挙動**
  //     ・区画単位の値（back_color / signage_url / is_auto_extend）は `pages[]` に含まれない
  //       （§3.5.2.2）。screens[] 直下のものを全頁で共通に使う
  //     ・周期は **フロント固定 15 秒**（JSON には持たせない。§3.5.2.2「切替の周期」）

  // video 判定は display_pattern_id ∈ {80, 90〜94}（§3.5.1）。
  //   pages[] の要素は `type` を持たない（仕様に無い）ため、dp からの導出が必須。
  //   旧形式（プロト gen_data）の screen.type は引き続き優先する。
  var VIDEO_DISPLAY_PATTERN_IDS = { 80: 1, 90: 1, 91: 1, 92: 1, 93: 1, 94: 1 };

  // screen → 正規化した頁の配列。`pages` 未出力の JSON では [screen 相当] の 1 件になる。
  //   ⚠ `pages[].races` は v1.8 §6.4.7 で「常に出力」だが、**先行反映の STG では未出力**の
  //     期間がある。その間は screens[].races で代替する（同一場のローテのみ成立）。
  //     ただし **頁の場が代表枠と違う**のに races が無い場合は、代替すると
  //     **別の場のレースを出してしまう**ので、その頁を落として警告する（黙って誤表示しない）。
  function normalizeScreenPages(screen) {
    var toPage = function(p, i) {
      var isSelf = (p === screen);
      // 🔴 §3.5.2.2「screens[] 直下は **pages[0] と同値**」。したがって **pages[0] は直下の値を
      //   引き継いでよい**（頁2以降は自分の値だけを使う）。
      //   2026-08-19: ここを `p === screen` だけで判定しており、`pages` がある JSON では
      //   pages[0] が別オブジェクトになるため **screen.video_config を落としていた**。
      //   その結果 dp80 の venue_code が解決できず `Unknown venue_code: null` で
      //   動画が出なかった（8/19 STG monitor 1 sec04 / monitor 2 sec02 で実測）。
      //   place_cd 等は元から無条件に引き継いでおり、video_config だけが取り残されていた。
      var isFirst = isSelf || i === 0;
      var dpid = (p.display_pattern_id != null) ? p.display_pattern_id : screen.display_pattern_id;
      // 旧形式の screen.type は自分自身の頁にだけ効かせる（頁ごとの種別は dp が正）
      var explicitType = p.type || (isSelf ? screen.type : null);
      return {
        raw:                  p,
        place_cd:             (p.place_cd != null) ? p.place_cd : screen.place_cd,
        organizer_type:       (p.organizer_type != null) ? p.organizer_type : screen.organizer_type,
        display_pattern_id:   dpid,
        display_pattern_name: (p.display_pattern_name != null) ? p.display_pattern_name : screen.display_pattern_name,
        // 旧形式（プロト gen_data）の template 直指定は screen 単位。resolveTemplate が読む
        template:             p.template || (isSelf ? screen.template : null),
        target_race_no:       (p.target_race_no != null) ? p.target_race_no : null,
        target_date_offset:   p.target_date_offset || 0,
        races:                (p.races != null) ? p.races : (screen.races || []),
        racesInherited:       (p.races == null),
        // 旧フラット形式（screen 直下に venue_code 等）の dual-read は自分自身の頁のみ
        video_config:         (p.video_config != null) ? p.video_config : (isFirst ? screen.video_config : null),
        type:                 explicitType || (VIDEO_DISPLAY_PATTERN_IDS[dpid] ? 'video' : 'odds')
      };
    };
    var raw = (screen.pages && screen.pages.length) ? screen.pages : [screen];
    var pages = [];
    raw.forEach(function(p, i) {
      var page = toPage(p, i);
      if (page.racesInherited && p !== screen && String(page.place_cd) !== String(screen.place_cd)) {
        // 2026-08-19: 代表枠が **video 頁**のときは place_cd が省略されうる（§3.5.2.2「video 頁では省略可」。
        //   実際 dp80 は場を video_config.venue_code で持つ）。この場合「場が違う」ではなく
        //   「代表枠に場が無く、引き継げる races も無い」が正しい説明なので文言を分ける。
        var why = (screen.place_cd == null)
          ? '代表枠が場を持たない画面（dp' + screen.display_pattern_id + '）で、引き継げる races がありません'
          : '代表枠（場 ' + screen.place_cd + '）と場が違うため参照先を決められません';
        console.warn('[pages] 頁' + (i + 1) + '（場 ' + page.place_cd + ' / dp' + page.display_pattern_id
          + '）は pages[].races を持たず、' + why + '。この頁をスキップします'
          + '（JSON構造仕様書 v0.6.7 §3.5.2.2「pages[].races は常に出力する」の反映待ち）。');
        return;
      }
      pages.push(page);
    });
    return pages.length ? pages : [toPage(screen, 0)];
  }

  // 頁の place_cd が venue_filters（§3.13）の対象外なら、その頁はスキップする（§3.5.2.2）。
  //   ⚠ 1 頁しか無い screen には適用しない。従来 venue_filters は races[] の絞込みにしか
  //     使っておらず、ここで画面ごと落とすと **既存の単一表示の挙動が変わる**ため。
  function filterPagesByVenue(pages, venueFilters) {
    if (!venueFilters || !venueFilters.length) return pages;
    if (!pages || pages.length < 2) return pages;
    var kept = pages.filter(function(page) {
      if (page.type === 'video') return true;       // video は場コードを持たないことがある
      if (page.place_cd == null) return true;
      for (var i = 0; i < venueFilters.length; i++) {
        if (String(venueFilters[i].place_cd) === String(page.place_cd)
         && (!page.organizer_type || venueFilters[i].organizer_type === page.organizer_type)) return true;
      }
      console.warn('[pages] 場 ' + page.place_cd + '（dp' + page.display_pattern_id
        + '）は venue_filters の対象外のため頁をスキップします（§3.5.2.2）。');
      return false;
    });
    return kept.length ? kept : pages;   // 全滅時は従来動作を優先（画面を消さない）
  }
  // === END: v0.6.7 pages[] 同一区画ローテーション ===

  function buildScreenStates(slot, venueFilters) {
    var screens = slot.screens || [];
    // 2026-06-04: slot.signage_url を screens[*] に伝播 (CRM の時間帯設定はスロット単位、
    //   要件定義書 v3.3 §3.2 SCR-CUT-003)。screen 個別の signage_url が定義されていない場合のみ補完。
    var slotSignageUrl = slot.signage_url || null;
    return screens.map(function(screen) {
      // signage_url は screen 個別 > slot 全体 の優先順
      if (!screen.signage_url && slotSignageUrl) {
        screen.signage_url = slotSignageUrl;
      }
      // 2026-08-18: 頁（pages[]）を正規化し、先頭頁で state を組む。
      var pages = filterPagesByVenue(normalizeScreenPages(screen), venueFilters);
      var state = buildScreenPageState(screen, pages[0], venueFilters);
      state.screen = screen;          // 頁切替で組み直すため元 screen を保持
      state.pages = pages;
      state.pageIndex = 0;
      state.pageTick = 0;
      state.pageHoldSec = 0;
      // 🔴 2026-08-19: カットインのキーは raceKey を含むので**区画に1組**で足りる（引地様 №21）。
      //   当初「頁ごとの単一キー」にしたところ、頁2〜4 で復元されず
      //   **同じレースで4回連続発火**した（実測）。集合にして頁ローテで丸ごと引き継ぐ。
      state.cutinShownKeys = {};
      state.cutinSeededKeys = {};
      return state;
    });
  }

  // 2026-08-18: screen（区画単位の設定）と page（頁単位の設定）から screenState を組む。
  //   頁切替のたびに呼ばれ、**頁に依存する値だけ**を作る。
  //   pages を持たない JSON では page = screen 相当の 1 件なので、従来と同じ結果になる。
  function buildScreenPageState(screen, page, venueFilters) {
    // v0.6.3 dual-read: position/template を新旧両形式から解決（layout_section/display_pattern_id も可）
    var canonicalPos = resolveCanonicalPosition(screen);
    var resolvedTemplate = resolveTemplate(page);
    // 2026-06-29: 対象レース固定 / 前日発売（§3.5.4）。null=自動順送り / 0=当日。
    var targetRaceNo = page.target_race_no;
    var targetDateOffset = page.target_date_offset || 0;
    var pageType = page.type;
    // venue_filters（§3.13）で発売対象外レースを除外。ただし対象レース固定セル
    //   （target_race_no 指定）は運用者が明示選択した1レースなので絞込み対象外。
    var rawRaces = page.races || [];
    var filteredRaces = (pageType === 'video' || targetRaceNo != null)
      ? rawRaces
      : applyVenueFilters(rawRaces, venueFilters);
    if (pageType !== 'video' && targetRaceNo == null
     && rawRaces.length && !filteredRaces.length) {
      console.warn('[venue_filters] ' + canonicalPos + ' の発売対象レースが皆無 → 画面スキップ（§3.13.4）');
    }
    // 2026-07-30: 前日発売（§3.5.4）の参照先を offset 日ぶんずらす（山内様 実機検証 #2）。
    //   バッチは target_date_offset>=1 でも data_source に「当日」パスを出力する
    //   （2026-07-30 STG 実測。旭川 TV2: offset=1 でも odds/20260730/... のまま）。
    //   従来フロントは offset を「前日発売」ラベルにしか使っておらず、参照先が当日の
    //   ままだったため「当日のレースが前日発売と表示される」状態になっていた。
    //   ここで races[].data_source を書き換え、以降の全消費側（オッズ画面・出走成績・
    //   変更情報）に一括で効かせる。
    if (targetDateOffset >= 1) {
      filteredRaces = filteredRaces.map(function(race) {
        var copy = {};
        for (var k in race) { if (race.hasOwnProperty(k)) copy[k] = race[k]; }
        copy.data_source = shiftDataSourceDate(race.data_source, targetDateOffset);
        return copy;
      });
    }
    var state = {
      position: canonicalPos,
      template: resolvedTemplate,
      type: pageType,
      // 2026-07-15: 出走成績の固定範囲/自動ページング判定等で全画面種別が dp を参照する
      displayPatternId: page.display_pattern_id,
      // 2026-07-15: dp50（出走成績 自動ページング）のページ状態
      entriesPages: null,
      entriesPageIndex: 0,
      entriesPageTick: 0,
      // 2026-08-04: dp20/30/40（オッズ画面の自動ページング）のページ状態（ISH-14 ②③）。
      //   2026-08-16 ISH-25: 全ページを1テンプレで描くようにしたので、
      //   ここはテンプレではなく**ページ数と種別**だけを持つ。
      // 2026-08-16 ISH-25: テンプレ配列 → ページ数＋種別
      oddsPageCount: ODDS_PAGE_COUNT[page.display_pattern_id] || 0,
      oddsPageKind:  ODDS_PAGE_KIND[page.display_pattern_id] || null,
      oddsPageIndex: 0,
      oddsPageTick: 0,
      // 乙案: テンプレ駆動のページ数（dp10）。子の申告で埋まるまでは 1 扱い。
      childPageCount: 1,
      // 2026-08-05 (引地様 №22): テンプレパス → そのページに中身があるか。
      //   子（common.js notifyOddsPagesAvailability）が全ページ分をまとめて通知する。
      //   未通知のページは true 扱い（＝従来どおり送る）。レース切替でクリアする。
      oddsPageAvailable: [],
      // 2026-08-05 (引地様 №21): カットインの発火済みキーと表示中フラグ。
      //   ページ送りは iframe をリロードするため子の状態が飛ぶ。親が持って復元する。
      cutinShownForRace: null,
      cutinActive: false,
      oddsPageHoldSec: 0,
      races: filteredRaces,
      // 2026-07-30: 変更情報（dp=70）は「モニターに設定した競馬場」ではなく
      //   売場別発売設定の発売場をすべてカバーする（及川決定）。
      //   CRM は 1 画面 1 場所のモデルで、画面選択2〜4 に別の場を入れても
      //   スケジュール JSON には反映されない（2026-07-30 STG 実測）。
      //   そのため screen.races[] ではなく venue_filters から列を組み立てる。
      venue_filters: venueFilters || [],
      target_race_no: targetRaceNo,
      target_date_offset: targetDateOffset,
      currentRaceIndex: -1,
      currentRaceId: null,
      lastTransitionMs: 0,
      iframeEl: getIframeByPosition(canonicalPos),
      videoConfig: null,
      // Phase 5 (2026-04-22): ヘッダー背景色（HEX 6 桁、'#' なし）。CRM 由来の
      //   monitor_schedules_detail.back_color_id → back_color.back_color_code を想定。
      //   値あれば iframe の :root CSS 変数 --race-header-bg に #HEX を注入する。
      //   ⚠ v0.6.7 §3.5.2.2: back_color は**区画単位**。頁ごとには変えられない。
      back_color_code: screen.back_color_code || null,
      // 2026-06-04: SCR-CUT-003 サイネージカットイン用 URL。slot 単位の signage_url を
      //   screens[*] へ伝播済 (buildScreenStates 直前に caller が注入)。
      signage_url: screen.signage_url || null,
      // H-03 (2026-04-19): single-screen.html の枠連/枠単ページング管理
      //   template が single-screen.html のときのみ 1秒tick で 'uren'↔'utan' を切替。
      //   レース切替時・slot切替時に uren にリセット。他テンプレは無視される。
      //   hasFrameUtan: 子 iframe からの通知で更新される枠単発売有無フラグ。
      //     発売なし時は checkFrameOddsPaging がスキップされ、枠連のみ表示される。
      frameOddsPage: 'uren',
      frameOddsPageTick: 0,
      hasFrameUtan: true  // 初期値 true。子から通知受信で false に更新される可能性あり
    };
    if (state.type === 'video') {
      if (window.DosVideoDisplay && DosVideoDisplay.isGreenPattern(page.display_pattern_id)) {
        // 2026-07-15: 中央（GCH、dp90-94）。池澤様 STG 実装の取り込み。
        //   ch=dp-89 を DosVideoDisplay.greenConfig が導出（video_config は null 前提）。
        //   audio_muted 未指定時は音声デフォルト出力方針（2026-07-14）に合わせ false。
        var gcfg = DosVideoDisplay.greenConfig(page);
        var gvc = page.video_config || {};
        if (gvc.audio_muted == null) gcfg.audio_muted = false;
        state.videoConfig = gcfg;
      } else {
        // 2026-07-14: v0.6.5 §3.7 のネスト形式（screen.video_config）が正。
        //   旧フラット形式（screen 直下に venue_code 等）は既存 schedule JSON の
        //   後方互換として dual-read する（生成側の実値出力開始後に削除可）。
        //   2026-08-18: 頁単位では page.video_config（§3.5.2.2）が正。
        var vc = page.video_config || page.raw || {};
        // 2026-07-15: venue_code 未供給（内山様バッチ実装前）の間は、cell の place_cd
        //   (コード表105) からフロントで自己解決する（池澤様 DosVideoDisplay.narConfig）。
        var narFallback = (!vc.venue_code && window.DosVideoDisplay)
          ? DosVideoDisplay.narConfig(page) : null;
        state.videoConfig = {
          venue_code:             vc.venue_code || (narFallback && narFallback.venue_code),
          quality_mode:           vc.quality_mode || 'auto',
          quality_cap:            vc.quality_cap,
          quality_fixed:          vc.quality_fixed,
          // 2026-07-14 方針: 音声はデフォルト出力（未指定時 muted=false、フォールバックは video-frame.html）
          audio_muted:            vc.audio_muted != null ? vc.audio_muted : false,
          volume:                 vc.volume != null ? vc.volume : 0.7,
          video_source_override:  vc.video_source_override
        };
      }
    }
    return state;
  }

  function initializeScreen(state) {
    if (state.type === 'video') {
      applyVideoScreen(state);
      return;
    }
    // 3R/6R-entries-results: display_pattern_id 50-54（3R）/ 60-62（4K 6R）
    //   1 iframe で 3 or 6 レース分を並列描画するため、専用ディスパッチャに分岐。
    if (state.template === 'templates/entries-results-3r.html'
     || state.template === 'templates/entries-results-6r.html') {
      applyEntriesResultsScreen(state);
      return;
    }
    // changes-info: display_pattern_id=70（変更情報）
    //   1 iframe で 3 場分の changes JSON を並列描画する専用ディスパッチャ。
    if (state.template === 'templates/changes-info.html') {
      applyChangesInfoScreen(state);
      return;
    }
    // 2026-06-29: 対象レース固定（§3.5.4）。target_race_no 指定時は順送りせず該当レースに固定。
    if (state.target_race_no != null) {
      state.currentRaceIndex = findRaceIndexByRaceNo(state.races, state.target_race_no);
      if (state.currentRaceIndex < 0 && state.races.length) state.currentRaceIndex = 0; // 念のため
    } else {
      // 🔴 2026-08-19: 頁ローテでは**レース選択をやり直さない**。
      //   頁は賭式・表示形式が変わるだけで、見ているレースは同じはず。
      //   やり直すと getInitialRaceIndex が payout 未着の**締切済みレースを掴み直し**、
      //   その1〜2秒後に次レースへ遷移する往復が毎回起きる。
      //   症状: 「切替時に一瞬 前のR が表示される」＋「締切カットインが毎回再発火する」
      //   （2026-08-19 STG monitor 1 区画03 で実測: 頁3に入るたび 2R→3R を往復）。
      //   preferRaceId は applyScreenPage が頁切替の直前に積む。**同じ race_id が
      //   新しい races[] に無ければ（＝場が違う頁）通常どおり初期選択する。**
      var pref = state.preferRaceId ? findRaceIndexById(state.races, state.preferRaceId) : -1;
      state.currentRaceIndex = (pref >= 0) ? pref
                                           : getInitialRaceIndex(state.races, correctedNow());
      state.preferRaceId = null;
    }
    if (state.currentRaceIndex >= 0) {
      state.currentRaceId = state.races[state.currentRaceIndex].race_id;
    }
    applyOddsScreen(state);
  }

  // 2026-08-19: races[] から race_id で index を引く（頁ローテのレース維持に使う）。
  function findRaceIndexById(races, raceId) {
    if (!races || !raceId) return -1;
    for (var i = 0; i < races.length; i++) {
      if (races[i].race_id === raceId) return i;
    }
    return -1;
  }

  // 2026-06-29: races[] から rr=target_race_no のレースを探す（§3.5.4 対象レース固定）。
  function findRaceIndexByRaceNo(races, raceNo) {
    if (!races) return -1;
    for (var i = 0; i < races.length; i++) {
      var info = parseRaceId(races[i].race_id);
      if (info && info.rr === raceNo) return i;
    }
    return -1;
  }

  // 3R-entries-results-phase2 (2026-04-21): 3 レース分の data_source を子 iframe へ postMessage で送信。
  //   既存の applyOddsScreen は 1 レース単位で動作するため、本関数で bundle 送信する。
  //   子テンプレ (entries-results-3r.html) は受信後、各列で results → odds フォールバック fetch を行う。
  // 2026-07-15: 出走成績の表示レース解決（display_patternマスタ整理一覧 §1）。
  //   実バッチは races[] に当日同場の全レースを出力する（スケジュールJSON出力PG設計書 v1.5 §6.5）
  //   ため、固定範囲（51-54/61/62）は rr で絞り込み、dp50/dp60 は自動ページングを行う。
  //   2026-08-04 訂正（及川）: dp60 は「**dp61/62（6R表示）をページングして 12R 分を見せる**」が
  //   正しい定義。従来は「絞り込み・ページングとも行わない（全件を 6r テンプレの
  //   6件×最大4ブロックへ自動配置）」という実装で、定義と食い違っていた。
  //   ⚠ プロトの monitor 128 は dp60 に 2場×1-12R=24件を渡して1画面に敷き詰める使い方を
  //     していたため、本改修で「2場の 1-6R」→「2場の 7-12R」の2ページ送りに変わる。
  var ENTRIES_FIXED_RANGE = { 51: [1, 3], 52: [4, 6], 53: [7, 9], 54: [10, 12], 61: [1, 6], 62: [7, 12] };
  // 自動ページングの帯域。dp50 は 3R 帯 ×4、dp60 は 6R 帯 ×2（= dp61 → dp62）。
  var ENTRIES_PAGE_RANGES_BY_DP = {
    50: [[1, 3], [4, 6], [7, 9], [10, 12]],
    60: [[1, 6], [7, 12]]
  };
  var ENTRIES_PAGE_RANGES = ENTRIES_PAGE_RANGES_BY_DP[50];  // 後方互換（既存参照用）
  var ENTRIES_PAGE_SEC = (function() {
    var v = Number(new URL(location.href).searchParams.get('page_rotation'));
    return (v && v > 0) ? v : 15;  // 秒。?page_rotation= で上書き（デモ・検証用）
  })();

  // 2026-08-04: オッズ画面の自動ページング（ISH-14 ②③ / 引地様 8/1 確認表）。
  //   「自動ページング」を名乗る dp10/20/30/40/50 のうち、実装があったのは
  //     dp10 … 子テンプレ single-umaren-wide.html 内でローテ
  //     dp50 … 親側で entriesPages をローテ
  //   の 2 つだけで、**dp20/30/40 は固定①と同じテンプレに解決されるだけ**でページ送りが
  //   無かった（dp40→single-popular.html は dp41 と同一、等）。dp50 と同じ「親側でローテ」
  //   方式に揃えて補う。ローテは template を差し替えるため applyOddsScreen が
  //   iframe.src を貼り替える（dp50 と同じ挙動）。
  // 2026-08-16 (ISH-25): テンプレ配列 → **ページ数**へ。テンプレは1枚に統合したので、
  //   ローテは「何ページあるか」だけ分かればよい。切替は postMessage(setOddsPage)。
  //   kind は子が空ページ通知（oddsPagesAvailability）で名乗る種別と一致させる。
  var ODDS_PAGE_KIND = {
    20: 'umaren',
    30: 'umatan',
    40: 'popular'
  };
  var ODDS_PAGE_COUNT = {
    20: 2,
    30: 2,
    40: 2
  };
  // 2026-08-04: 馬連・ワイド（dp10-13）は 1 テンプレ内でページ制御する作りで、
  //   子は ?page=N で固定ページになる（single-umaren-wide.html の forcedPage）。
  //   ところが親は ?page= を「親URLからの素通し」しかしておらず dp から導出していなかったため、
  //   dp11/12/13 を選んでも固定にならず常にローテしていた。dp→page をここで与える。
  //   dp10（自動ページング）は page を付けない＝テンプレ側のローテに任せる。
  // 2026-08-16 (ISH-25): 統合に伴い 21/22・31/32・41/42 もここで固定ページを与える。
  //   dp11/12/13（馬連・ワイド）は従来どおり。
  var ODDS_FIXED_PAGE = {
    11: 1, 12: 2, 13: 3,
    21: 1, 22: 2,
    31: 1, 32: 2,
    41: 1, 42: 2
  };
  var ODDS_PAGE_SEC = ENTRIES_PAGE_SEC;  // 既定 15 秒。?page_rotation= で一括上書き
  // 2026-08-18: 区画内の頁ローテーション（pages[]）の周期。JSON構造仕様書 v0.6.7 §3.5.2.2 で
  //   **フロント固定 15 秒**と定めた（JSON には持たせない）。既存の自動ページングと同一周期。
  //   将来 CRM で設定可能にする場合は screens[].page_rotation_sec（予約済・v0.6.7 では未出力）。
  // 2026-08-19 (案B): 頁ローテのダブルバッファ。
  //   区画あたり iframe を 2 枚持ち、表示中の裏で次頁を読み込み、
  //   **子から renderReady が来てから**入れ替える。空白 0ms を狙う。
  //   案A（データ到着まで遮蔽）で空白は「暗転」になったが、4区画が同時に
  //   約 217ms 暗転する（2026-08-19 STG monitor 3 の録画をフレーム解析）。
  //   保守的に、必要なときだけ 2 枚目を作る:
  //     ・頁が 1 つの区画は作らない（＝従来と完全に同じ経路）
  //     ・動画（dp80/90-94）は対象外。HLS プレイヤを二重に起こさない
  //     ・次頁のテンプレが同じなら iframe は再ロードされない＝空白が出ないので不要
  //   ?dblbuf=0 で丸ごと無効化できる（切り戻し用）。
  //   ⚠ query の解釈は上方の IIFE で行うが、この var 代入は**その後に実行される**ため
  //   そこで false にしても true で上書きされてしまう（2026-08-19 に踏んだ）。ここで直接読む。
  var DOUBLE_BUFFER = !/(^|[?&])dblbuf=0([&#]|$)/.test(location.search);
  var PRELOAD_LEAD_SEC = 4;    // 何秒前から裏で読み込むか
  // 🔴 2026-08-19 (甲案): カットイン表示中は頁送りを保留するが、**保留したぶんを
  //   次の頁から差し引いて位相を戻す**。戻さないと、カットインが出た区画だけ
  //   他区画から遅れたままになり、4 区画の切替が揃わなくなる。
  //   カットインの判定を毎秒に直した（common.js startHeaderTicker）ことで
  //   カットインが滞在の途中で始まり境界をまたぐようになったため、この保留が
  //   起きやすくなった。差し引いても最低 MIN_PAGE_VISIBLE_SEC は必ず表示する。
  var MIN_PAGE_VISIBLE_SEC = 5;
  var SCREEN_PAGE_SEC = ENTRIES_PAGE_SEC;  // 既定 15 秒。?page_rotation= で一括上書き

  // race の R 番号。schedule races[] の rr（設計書 v1.5）を優先し、無ければ race_id から復元
  function raceRr(race) {
    if (race && race.rr != null) return Number(race.rr);
    var info = race && parseRaceId(race.race_id);
    return info ? info.rr : null;
  }
  function racesInRange(races, range) {
    return (races || []).filter(function(r) {
      var n = raceRr(r);
      return n != null && n >= range[0] && n <= range[1];
    });
  }

  // 出走成績 screen が「今」表示すべきレース列を返す（dp50 はページ状態を進めず現ページを返す）
  function entriesRacesToShow(state) {
    var fixed = ENTRIES_FIXED_RANGE[state.displayPatternId];
    if (fixed) {
      var filtered = racesInRange(state.races, fixed);
      return filtered.length ? filtered : state.races;  // rr 復元不能な旧データは従来動作
    }
    // dp50（3R帯×4）/ dp60（6R帯×2 ＝ dp61 → dp62）の自動ページング
    var ranges = ENTRIES_PAGE_RANGES_BY_DP[state.displayPatternId];
    if (ranges) {
      var pages = [];
      ranges.forEach(function(rg) {
        var chunk = racesInRange(state.races, rg);
        if (chunk.length) pages.push(chunk);
      });
      // rr を復元できない旧データや、1 ページ分しか無い場合は従来どおり全件を返す
      if (!pages.length) return state.races;
      state.entriesPages = pages.length > 1 ? pages : null;
      if (state.entriesPageIndex >= pages.length) state.entriesPageIndex = 0;
      return pages[state.entriesPageIndex];
    }
    return state.races;
  }

  // dp50 / dp60 の自動ページング tick（1 秒ごとに呼ばれ、ENTRIES_PAGE_SEC ごとに次ページへ）
  function checkEntriesResultsPaging() {
    screenStates.forEach(function(state) {
      if (!ENTRIES_PAGE_RANGES_BY_DP[state.displayPatternId]) return;
      if (!state.entriesPages || state.entriesPages.length < 2) return;
      state.entriesPageTick = (state.entriesPageTick || 0) + 1;
      if (state.entriesPageTick < ENTRIES_PAGE_SEC) return;
      state.entriesPageTick = 0;
      state.entriesPageIndex = (state.entriesPageIndex + 1) % state.entriesPages.length;
      if (state.iframeEl) sendEntriesResultsPayload(state.iframeEl, state.entriesPages[state.entriesPageIndex]);
    });
  }

  // 2026-08-04: dp20/30/40（馬連・馬単・人気順の自動ページング）の tick（ISH-14 ②③）。
  //   1 秒ごとに呼ばれ、ODDS_PAGE_SEC ごとにページを送る。
  //   2026-08-16 ISH-25: **template は変えず postMessage(setOddsPage) でページ番号を送る。**
  //     旧方式（template を first↔second で差し替え＝iframe.src 貼り替え）は
  //     4分割で3画面が同時に 0.33 秒暗転していた（録画のフレーム解析で実測）。
  //   固定ページの dp21/22/31/32/41/42 は oddsPageCount を持たないので対象外
  //     （ODDS_FIXED_PAGE で ?page=N を与える）。
  // 2026-08-05 (引地様 №22): そのページに中身があるか。子からの通知が無い間は true。
  //   dp50 の「ページが1つなら送らない」ガードを dp20/30/40 にも用意するための土台。
  function oddsPageIsAvailable(state, idx) {
    // 2026-08-16 ISH-25: 子は自分の種別の全ページを配列で答える（0 始まり）
    return state.oddsPageAvailable[idx] !== false;
  }
  // 現在ページから見て次に送るべきページ。中身のあるページが他に無ければ現在ページを返す。
  function nextAvailableOddsPage(state) {
    var len = state.oddsPageCount || 0;
    for (var i = 1; i < len; i++) {
      var cand = (state.oddsPageIndex + i) % len;
      if (oddsPageIsAvailable(state, cand)) return cand;
    }
    return state.oddsPageIndex;
  }
  // 2026-08-05 №21: カットイン表示中にページ送りするとリロードで表示が切れる。
  //   最大待ち時間は CUT-002(10秒) → CUT-003(30秒) の連鎖ぶん＋余裕。
  //   子が「終わった」を返せなくなった場合に固まらないための上限。
  var ODDS_PAGE_CUTIN_HOLD_MAX_SEC = 45;

  /**
   * 2026-08-16 (ISH-25): 表示中の子へページ番号を送る。**iframe.src は触らない。**
   *   これが「ちらつかない」ことの本体。子は DOM を描き替えるだけで再読込しない。
   *   出走成績（dp50/60）が既に同じ考え方（sendEntriesResultsPayload）で動いている。
   */
  function sendOddsPage(state) {
    if (!state.iframeEl || !state.iframeEl.contentWindow) return;
    try {
      state.iframeEl.contentWindow.postMessage({
        type: 'setOddsPage',
        page: state.oddsPageIndex + 1   // 子は 1 始まりで受ける（?page=N と同じ）
      }, '*');
    } catch (_) {}
  }

  function checkOddsAutoPaging() {
    screenStates.forEach(function(state) {
      if (state.type !== 'odds') return;
      if (!state.oddsPageCount || state.oddsPageCount < 2) return;
      if (!state.iframeEl) return;
      state.oddsPageTick = (state.oddsPageTick || 0) + 1;
      if (state.oddsPageTick < ODDS_PAGE_SEC) return;
      // カットイン表示中は送らない。
      // 2026-08-16: 再読込しなくなったので「表示が途中で切れる」理由は消えたが、
      //   カットイン中に背後の内容が変わるのは落ち着かないため待つ方針は維持する。
      if (state.cutinActive && state.oddsPageHoldSec < ODDS_PAGE_CUTIN_HOLD_MAX_SEC) {
        state.oddsPageHoldSec++;
        return;   // tick は据え置き。カットインが明けた次の tick で送る
      }
      state.oddsPageHoldSec = 0;
      state.oddsPageTick = 0;
      // 2026-08-05 №22: 中身の無いページ（少頭数の「軸馬10〜」等）へは送らない
      var next = nextAvailableOddsPage(state);
      if (next === state.oddsPageIndex) return;   // 送り先が無い＝1ページ運用
      state.oddsPageIndex = next;
      sendOddsPage(state);
    });
  }

  // 2026-08-18: 区画内の頁ローテーション（pages[]、JSON構造仕様書 v0.6.7 §3.5.2.2）。
  //   CRM「画面選択1〜4」を 15 秒ごとに送る。**1 頁のときは何もしない**（従来動作）。
  //   既存の自動ページング（dp10/20/30/40/50/60）とは**別の軸**である点に注意。
  //     ・自動ページング … 1 つの表示パターンの中でページを送る（同じ dp のまま）
  //     ・頁ローテーション … **表示パターンごと差し替える**（dp51→52→53→54、場も賭式も変わりうる）
  //   そのため state を頁ごとに組み直して initializeScreen をやり直す。
  //   dp51→54 のように**テンプレが同じ**なら applyEntriesResultsScreen が postMessage だけ
  //   行うので iframe は再読込されない（＝暗転しない）。テンプレが変わる頁では再読込になる。
  function applyScreenPage(state, nextIndex) {
    var page = state.pages[nextIndex];
    if (!page) return;
    // 🔴 2026-08-19: カットインの発火済みキーを頁ごとに退避・復元する。
    //   子のキーは `raceKey + '_countdown' / '_closed'`（common.js）＝**レースに紐づく**。
    //   ところが buildScreenPageState は毎回 cutinShownForRace を null で作り直すため、
    //   **頁が回るたびに「まだ出していない」に戻り、同じレースの締切カットインが再発火**していた
    //   （2026-08-19 STG monitor 1 区画03「園田 馬連①」で実測。dp51→52→21→22 は
    //     テンプレか ?page= が毎回変わるので iframe が再読込され、そのたびに出ていた）。
    //   頁ごとに持つのは、頁が**別の場のレース**を出しうるため（screen に 1 つでは足りない）。
    state.cutinShownKeys = state.cutinShownKeys || {};
    state.cutinSeededKeys = state.cutinSeededKeys || {};
    // 🔴 **上書きの前に**退避する。buildScreenPageState は currentRaceId を null で
    //   作り直すため、コピー後に読むと必ず null になる（2026-08-19 に踏んだ。
    //   「頁が変わってもレースを維持する」修正が丸ごと効いていなかった）。
    // 🔴 2026-08-19: **出走成績（dp50-54/60-62）は currentRaceId を持たない**（範囲表示のため）。
    //   そのまま引き継ぐと、出走成績の頁を通過した時点で null になり、
    //   次のオッズ頁で**毎回レースを選び直す**（＝締切済みレースを掴み直し、
    //   1〜2秒後に次レースへ飛ぶ「一瞬前のRが見える」＋カットイン再発火）。
    //   実測 2026-08-19 STG monitor 1 区画03（dp51→52→21→22）:
    //     頁1・頁2 は race=None → 頁3 で毎回 8R を掴み直し → 2秒後 9R へ。
    //   そこで **値が入っているときだけ更新する sticky な lastRaceId** に覚えさせ、
    //   出走成績の頁を跨いでもレースを保てるようにする。
    //   ⚠ 場が違う頁では findRaceIndexById が -1 を返し、通常の初期選択に落ちる（安全）。
    if (state.currentRaceId) state.lastRaceId = state.currentRaceId;
    var keepRaceId = state.lastRaceId || state.currentRaceId;
    var fresh = buildScreenPageState(state.screen, page, state.venue_filters);
    // fresh は頁依存の値だけを持つ。pages / pageIndex / screen 等の管理値は上書きされない。
    for (var k in fresh) { if (fresh.hasOwnProperty(k)) state[k] = fresh[k]; }
    // 集合は state に載ったまま引き継がれる（fresh に無いキーなので上書きされない）
    // 頁が変わっても見ているレースは維持する（上の initializeScreen が拾う）
    state.preferRaceId = keepRaceId;
    state.pageIndex = nextIndex;
    state.pageTick = 0;
    state.pageHoldSec = 0;
    initializeScreen(state);
  }

  // 🔴 2026-08-19 (乙案): 頁ローテ(pages[])の滞在時間を「内側のページ数」ぶん延ばす。
  //   内側の自動ページングも 15 秒周期なので、外側と**同じ周期・同じ起点**になり
  //   2 ページ目に切り替わる瞬間に外側が次の頁へ送っていた。
  //   実測 2026-08-19 STG monitor 3 区画01（130 秒観察）:
  //     dp20 馬連（自動ページング）… 常に 1/2。**2 ページ目が一度も出ない**
  //     dp40 人気順（自動ページング）… 常に 1/2。同上
  //     dp10 馬連ワイド … P2 は 3.7 秒だけ（案B の先読み 4 秒ぶんずれた副産物）
  //   これは 2026-08-18 に入れた pages[] が持ち込んだ退行で、
  //   画面選択に入れずに単独で使う限りは従来どおり動く。
  //   ⚠ 影響範囲を絞る作り:
  //     ・頁が 1 つの区画は checkScreenPageRotation が先に return する＝**呼ばれない**
  //     ・内側ページを持たない dp は 1 を返す＝滞在 15 秒のまま（従来と同じ）
  function innerPageCountOf(state) {
    // 親が駆動する自動ページング（dp20/30/40）。中身の無いページは数えない
    //   （少頭数で「軸馬10〜」が空になる場合。引地様 №22）。
    if (state.oddsPageCount >= 2) {
      var avail = 0;
      for (var i = 0; i < state.oddsPageCount; i++) { if (oddsPageIsAvailable(state, i)) avail++; }
      return Math.max(1, avail);
    }
    // テンプレが駆動する馬連ワイド（dp10）。ページ数は頭数で決まるので子が申告する。
    if (state.childPageCount >= 2) return state.childPageCount;
    // 出走成績の自動ページング（dp50/60）
    if (state.entriesPages && state.entriesPages.length >= 2) return state.entriesPages.length;
    return 1;
  }

  function screenPageDwellSec(state) {
    return SCREEN_PAGE_SEC * innerPageCountOf(state);
  }

  // 案B: 区画の 2 枚目 iframe。**必要になった区画だけ**遅延生成する。
  //   .grid .cell は position:relative なので、両方を absolute inset:0 で重ねる。
  //   バッジ(.cell__badge)は z-index:1 なので、iframe をバッジの**前**に挿すと上に残る。
  function ensureBufferIframe(state) {
    var n = positionToFrameNum(state.position);
    if (!n) return null;
    var primary = document.getElementById('frame' + n);
    if (!primary || !primary.parentNode) return null;
    var stack = function(el) {
      el.style.position = 'absolute';
      el.style.left = '0'; el.style.top = '0';
      el.style.width = '100%'; el.style.height = '100%';
    };
    var buf = document.getElementById('frame' + n + 'b');
    if (!buf) {
      buf = document.createElement('iframe');
      buf.id = 'frame' + n + 'b';
      buf.name = 'frame' + n + 'b';
      stack(buf);
      buf.style.visibility = 'hidden';
      var badge = primary.parentNode.querySelector('.cell__badge');
      primary.parentNode.insertBefore(buf, badge || null);
      stack(primary);   // 主 iframe も重ね合わせ座標に揃える（見た目は不変）
    }
    // 🔴 2026-08-19: 裏は「いま表示していない方」。**入れ替えるたびに役割が逆転する**。
    //   常に frameNb を裏だと決め打ちすると、2 回目の頁送りで
    //   **表示中の iframe を潰して 4 秒間なにも映らなくなる**（STG monitor 3 で実測）。
    return (state.iframeEl === buf) ? primary : buf;
  }

  // その頁送りでバッファが要るか。要らないなら従来経路（applyScreenPage）に落とす。
  function pageSwapNeedsBuffer(state, nextPage) {
    if (!DOUBLE_BUFFER) return false;
    if (!state.pages || state.pages.length < 2) return false;
    if (state.type === 'video') return false;
    if (!nextPage || nextPage.type === 'video') return false;
    // テンプレが変わらないなら applyOddsScreen は iframe を再ロードしない＝空白が出ない
    return resolveTemplate(nextPage) !== state.template;
  }

  function abortPagePreload(state) {
    if (!state || !state.preload) return;
    var el = state.preload.st && state.preload.st.iframeEl;
    if (el) {
      el.style.visibility = 'hidden';
      el.onload = null;
      el.removeAttribute('data-template');
      el.removeAttribute('data-source');
      el.removeAttribute('data-sig');
      el.src = 'about:blank';
    }
    state.preload = null;
  }

  // 裏で次頁を組み立てる。**state 本体はまだ書き換えない**（表示中の頁が壊れる）。
  function startPagePreload(state, nextIndex) {
    var page = state.pages[nextIndex];
    if (!page) return false;
    var buf = ensureBufferIframe(state);
    if (!buf) return false;
    if (state.currentRaceId) state.lastRaceId = state.currentRaceId;
    var pre = {}, k, k2;
    for (k in state) { if (state.hasOwnProperty(k)) pre[k] = state[k]; }
    var fresh = buildScreenPageState(state.screen, page, state.venue_filters);
    for (k2 in fresh) { if (fresh.hasOwnProperty(k2)) pre[k2] = fresh[k2]; }
    pre.screen = state.screen;
    pre.pages  = state.pages;
    pre.pageIndex = nextIndex;
    pre.preferRaceId = state.lastRaceId || state.currentRaceId;
    pre.iframeEl = buf;
    pre.preload = null;
    // カットインの集合は state と**同じオブジェクト**を共有する（区画に 1 組）
    pre.cutinShownKeys  = state.cutinShownKeys;
    pre.cutinSeededKeys = state.cutinSeededKeys;
    state.preload = { index: nextIndex, st: pre, ready: false };
    buf.style.visibility = 'hidden';
    initializeScreen(pre);
    // 裏でカットインを出させない（出すと発火済みキーを消費し、表で二度と出なくなる）
    sendCutinSuppressed(buf, true);
    return true;
  }

  // 裏の描画が済んだので表に出す。
  function commitPagePreload(state) {
    var pre = state.preload.st, k;
    var oldEl = state.iframeEl;
    pre.iframeEl.style.visibility = '';
    if (oldEl && oldEl !== pre.iframeEl) oldEl.style.visibility = 'hidden';
    for (k in pre) { if (pre.hasOwnProperty(k)) state[k] = pre[k]; }
    state.preload = null;
    state.pageTick = 0;
    state.pageHoldSec = 0;
    // 裏に回った側は空にする。放置すると 1 区画で 2 つの文書がポーリングし続け、
    //   取得回数が常時 2 倍になる（次の先読みで読み直すので実害はない）。
    if (oldEl && oldEl !== state.iframeEl) {
      oldEl.onload = null;
      oldEl.removeAttribute('data-template');
      oldEl.removeAttribute('data-source');
      oldEl.removeAttribute('data-sig');
      oldEl.src = 'about:blank';
    }
    // 表に出たので抑止を解く。子は最後に見たレースで即座に再判定する。
    sendCutinSuppressed(state.iframeEl, false);
    // 乙案: 先読みで 4 秒早く起きているぶん、テンプレ駆動のページ送り（dp10）は
    //   表に出た時点で 1 ページ目から数え直させる。これが無いと
    //   P1 が 11 秒・最後にまた P1 が 4 秒、という半端な出方になる。
    if (state.iframeEl && state.iframeEl.contentWindow) {
      try { state.iframeEl.contentWindow.postMessage({ type: 'resetPageRotation' }, '*'); } catch (_) {}
    }
  }

  // 甲案: 保留したぶんを次の頁の tick に繰り越し、他区画との位相を戻す。
  //   ただし次の頁が一瞬で消えないよう、最低 MIN_PAGE_VISIBLE_SEC は表示する。
  function applyPageCatchUp(state, carrySec) {
    if (!carrySec || carrySec <= 0) return;
    var d = screenPageDwellSec(state);
    var maxCarry = Math.max(0, d - MIN_PAGE_VISIBLE_SEC);
    state.pageTick = Math.min(carrySec, maxCarry);
  }

  function sendCutinSuppressed(iframe, on) {
    if (!iframe || !iframe.contentWindow) return;
    try { iframe.contentWindow.postMessage({ type: 'setCutinSuppressed', on: !!on }, '*'); } catch (_) {}
  }

  // preload 中の iframe から来たメッセージの持ち主を引く（renderReady 専用）。
  function findPreloadOwner(sourceWin) {
    for (var i = 0; i < screenStates.length; i++) {
      var s = screenStates[i];
      if (s.preload && s.preload.st.iframeEl && s.preload.st.iframeEl.contentWindow === sourceWin) return s;
    }
    return null;
  }

  // 1 秒 tick。SCREEN_PAGE_SEC ごとに次の頁へ送る。
  function checkScreenPageRotation() {
    screenStates.forEach(function(state) {
      if (!state.pages || state.pages.length < 2) return;   // 単一頁 = 従来どおり何もしない
      state.pageTick = (state.pageTick || 0) + 1;
      var dwell = screenPageDwellSec(state);   // 乙案: 内側ページ数ぶん延ばす
      // 甲案で tick を進めるため === では取り逃す。>= にして二重起動は下の条件で防ぐ。
      if (state.pageTick >= dwell - PRELOAD_LEAD_SEC) {
        var ni = (state.pageIndex + 1) % state.pages.length;
        if (pageSwapNeedsBuffer(state, state.pages[ni])
            && (!state.preload || state.preload.index !== ni)) {
          abortPagePreload(state);
          startPagePreload(state, ni);
        }
      }
      if (state.pageTick < dwell) return;
      // カットイン表示中は送らない（checkOddsAutoPaging と同じ方針・同じ上限）
      if (state.cutinActive && state.pageHoldSec < ODDS_PAGE_CUTIN_HOLD_MAX_SEC) {
        state.pageHoldSec++;
        return;   // tick は据え置き。カットインが明けた次の tick で送る
      }
      var next = (state.pageIndex + 1) % state.pages.length;
      // 甲案: カットインで保留した秒数。頁送りの直後に次の頁の tick へ繰り越す。
      var carry = state.pageHoldSec || 0;
      // 案B: 裏の描画が終わっていれば**空白なしで**入れ替える。
      //   終わっていなければ従来経路に落とす（＝今までどおり。止まらない）。
      if (state.preload && state.preload.index === next) {
        if (state.preload.ready) { commitPagePreload(state); applyPageCatchUp(state, carry); return; }
        abortPagePreload(state);
      }
      applyScreenPage(state, next);
      applyPageCatchUp(state, carry);
    });
  }

  // 2026-08-18: 検証用。頁ローテーションは**時間軸の挙動**なので、スクショでも静的リンタでも
  //   捕まらない（CLAUDE.md「名前が動作を約束するものは名前から検査する」）。
  //   render_matrix.py / ブラウザコンソールから現在の頁を読めるようにしておく。
  window.DosDebugScreens = function() {
    return screenStates.map(function(s) {
      return {
        position: s.position,
        template: s.template,
        display_pattern_id: s.displayPatternId,
        place_cd: s.pages && s.pages[s.pageIndex] ? s.pages[s.pageIndex].place_cd : null,
        page: (s.pageIndex + 1) + '/' + (s.pages ? s.pages.length : 1),
        // 2026-08-19: 親が駆動する自動ページング（dp20/30/40）の現在ページ。
        //   頁ローテ(pages[])と周期が同じだと 2 ページ目が出ないため、検証に要る。
        odds_page: (s.oddsPageIndex + 1) + '/' + (s.oddsPageCount || 1),
        page_dp: s.pages ? s.pages.map(function(p) { return p.display_pattern_id; }) : [],
        races: (s.races || []).length,
        current_race: s.currentRaceId
      };
    });
  };

  function applyEntriesResultsScreen(state) {
    var iframe = state.iframeEl;
    if (!iframe) return;
    var childQuery = buildChildQuery();
    var templateChanged = iframe.getAttribute('data-template') !== state.template;
    var racesToShow = entriesRacesToShow(state);
    if (templateChanged) {
      iframe.setAttribute('data-template', state.template);
      iframe.removeAttribute('data-sig');
      iframe.src = state.template + childQuery;
      iframe.onload = (function(races, bg) {
        return function() {
          // 2026-07-15: 出走成績ヘッダーにも CRM 背景色を適用（CSS 変数方式）
          applyHeaderColor(iframe, bg);
          sendEntriesResultsPayload(iframe, races);
        };
      })(racesToShow, state.back_color_code);
    } else {
      // iframe 再利用時（slot 切替で再割当など）は即時 postMessage
      applyHeaderColor(iframe, state.back_color_code);
      sendEntriesResultsPayload(iframe, racesToShow);
    }
  }

  // changes-info-phase5 (2026-04-22): 3 場分の changes JSON 参照 URL を postMessage 送信。
  //   race.data_source には `changes/{YYYYMMDD}/{ORG}_{PP}.json` を指定する想定。
  function applyChangesInfoScreen(state) {
    var iframe = state.iframeEl;
    if (!iframe) return;
    var childQuery = buildChildQuery();
    var templateChanged = iframe.getAttribute('data-template') !== state.template;
    if (templateChanged) {
      iframe.setAttribute('data-template', state.template);
      iframe.removeAttribute('data-sig');
      iframe.src = state.template + childQuery;
      iframe.onload = (function(st) {
        return function() { sendChangesInfoPayload(iframe, st); };
      })(state);
    } else {
      sendChangesInfoPayload(iframe, state);
    }
  }

  // 2026-07-30: 変更情報の列を venue_filters（§3.13）から組み立てる（及川決定）。
  //   ・モニターに設定した競馬場には左右されない
  //   ・売場が発売する全場を対象にする（3 場を超える場合は子側でページング）
  //   ・対象レースも売場別発売設定に従う（target_race_no_list を子へ渡して絞り込む）
  //   target_date_offset>=1 の行は前日発売用の重複エントリなので当日分だけを使う。
  //   パス規約は JSON 構造仕様書 §1.5（changes/{YYYYMMDD}/{organizer_type}_{place_cd}.json）。
  function changesColumnsOf(state) {
    var seen = {};
    return (state.venue_filters || []).filter(function(vf) {
      if (vf.target_date_offset) return false;
      var k = vf.organizer_type + '_' + vf.place_cd;
      if (seen[k]) return false;
      seen[k] = true;
      return true;
    }).map(function(vf) {
      return {
        race_id: vf.organizer_type + '_' + vf.place_cd,
        race_key: vf.place_cd,
        race_no_list: vf.target_race_no_list || null,
        url: DERUCA_CONFIG.resolveDataSource(
          'changes/' + DISPLAY_DATE + '/' + vf.organizer_type + '_' + vf.place_cd + '.json')
      };
    });
  }

  function sendChangesInfoPayload(iframe, state) {
    try {
      var cols = changesColumnsOf(state);
      // venue_filters が空の売場では従来どおり races[] を使う（後方互換）
      if (!cols.length) {
        cols = (state.races || []).map(function(race) {
          return {
            race_id: race.race_id,
            race_key: race.race_key,
            race_no_list: null,
            url: DERUCA_CONFIG.resolveDataSource(race.data_source)
          };
        });
      }
      iframe.contentWindow.postMessage({
        type: 'setChangesInfo',
        columns: cols.map(function(c) {
          return {
            race_id: c.race_id,
            race_key: c.race_key,
            race_no_list: c.race_no_list,
            url: c.url
          };
        })
      }, '*');
    } catch (_) {}
  }

  function sendEntriesResultsPayload(iframe, races) {
    try {
      // 6R-entries-results-phase4 (2026-04-21): テンプレに応じて 3R / 6R を自動判定。
      //   entries-results-6r.html なら 6 件まで送信、それ以外（3R テンプレ等）は 3 件まで。
      var tmpl = iframe.getAttribute('data-template') || '';
      var is6r = tmpl.indexOf('entries-results-6r') >= 0;
      // 6R(screen8 4分割) は最大 24 件送信（子が 6 件×最大4ブロック＝2×2 に描画。§8.8）。
      //   dp=61/62（固定 6R）は 6 件＝1ブロック、4分割(2場×1-12R)は 24 件＝4ブロック。
      var limit = is6r ? 24 : 3;
      var type  = is6r ? 'setEntriesResults6r' : 'setEntriesResults3r';
      iframe.contentWindow.postMessage({
        type: type,
        races: (races || []).slice(0, limit).map(function(race) {
          return {
            race_id: race.race_id,
            race_key: race.race_key,
            post_time_iso: race.post_time_iso,
            url: DERUCA_CONFIG.resolveDataSource(race.data_source)
          };
        })
      }, '*');
    } catch (_) {}
  }

  // 2026-07-15: CRM 背景色（back_color_code）→ 芥川ヘッダー色クラスの対応表。
  //   表示は style.css の .race-header.header-*（グラデーション 2 値）をそのまま流用する
  //   （単色ベタ塗りはしない＝芥川デザイン準拠。堀井様依頼_back_color芥川パレット10色化_20260715）。
  //   前半 10 件: 新パレット（back_color マスタ 10 色化後の HEX＝芥川グラデーション開始色）
  //   後半 8 件: 旧シード値（STG 実値 2026-07-15 SELECT 確認）の互換。マスタ更新の前後どちらでも動く。
  var BACK_COLOR_TO_HEADER_CLASS = {
    '4A4F57': 'header-gray',       '1C3FAA': 'header-blue',
    '8F4A00': 'header-orange',     '1F6F43': 'header-green',
    '7A1E2D': 'header-red',        '8A7A00': 'header-yellow',
    '3A6EA5': 'header-light_blue', '6B2F6B': 'header-purple',
    '006D6F': 'header-teal',       '007C91': 'header-deep_cyan',
    // 旧シード互換（A黒/B青/C茶/D緑/E赤茶/F黄緑/Gﾃﾞｨｰﾌﾟﾋﾟﾝｸ→水色/Hﾃﾞｨｰﾌﾟﾊﾟｰﾌﾟﾙ→紫）
    '000000': 'header-gray',       '0000FF': 'header-blue',
    '8B4513': 'header-orange',     '008000': 'header-green',
    'A52A2A': 'header-red',        '9ACD32': 'header-yellow',
    'FF1493': 'header-light_blue', '673AB7': 'header-purple'
  };

  // 芥川 style.css の .race-header.header-* グラデーション定義の写し（93.3deg / 45.95%→54.05%）。
  //   出走成績（3r/6r）のヘッダーは .race-header と別構造かつ描画ごとに再生成されるため、
  //   クラス付け替えではなく CSS 変数（--custom-header-grad）＋dos-overrides.css の受けルールで適用する。
  //   ※出典は style.css（芥川様アセット・改変禁止）。芥川様側で色定義が更新された場合はここも追従すること。
  var HEADER_GRADS = {
    'header-gray':       ['#4A4F57', '#303C50'],
    'header-blue':       ['#1C3FAA', '#001D76'],
    'header-orange':     ['#8F4A00', '#653400'],
    'header-green':      ['#1F6F43', '#0C5D31'],
    'header-red':        ['#7A1E2D', '#620514'],
    'header-yellow':     ['#8A7A00', '#5D5200'],
    'header-light_blue': ['#3A6EA5', '#0A427E'],
    'header-purple':     ['#6B2F6B', '#5E075E'],
    'header-teal':       ['#006D6F', '#005253'],
    'header-deep_cyan':  ['#007C91', '#005665']
  };

  // back_color_code を iframe 内ヘッダーに適用する。
  //   ① .race-header を持つテンプレ（単勝系・人気順系・マトリクス系・L字右下）: 芥川クラス付け替え
  //   ② 出走成績（3r/6r）: CSS 変数＋has-custom-hdr（2026-07-15 即適用・及川決定）
  //   Phase 5 (2026-04-22) の旧 CSS 変数注入方式は受け側 CSS 未実装で機能していなかったため置換。
  function applyHeaderColor(iframe, bg) {
    if (!bg) return;
    try {
      var doc = iframe.contentDocument;
      if (!doc) return;
      var cls = BACK_COLOR_TO_HEADER_CLASS[String(bg).toUpperCase()];
      if (!cls) {
        console.warn('[back_color] 芥川パレット対応表に無い back_color_code:', bg);
        return;
      }
      var hdr = doc.querySelector('.race-header');
      if (hdr) {
        Array.prototype.slice.call(hdr.classList).forEach(function(c) {
          if (/^header-[a-z_]+$/.test(c)) hdr.classList.remove(c);
        });
        hdr.classList.add(cls);
      }
      var g = HEADER_GRADS[cls];
      if (g) {
        doc.documentElement.style.setProperty('--custom-header-grad',
          'linear-gradient(93.3deg, ' + g[0] + ' 45.95%, ' + g[1] + ' 54.05%)');
        doc.documentElement.classList.add('has-custom-hdr');
      }
    } catch (_) {}
  }

  // odds screen: template を iframe に読み込み、data_source を postMessage で通知
  function applyOddsScreen(state) {
    var iframe = state.iframeEl;
    if (!iframe) return;
    var race = state.currentRaceIndex >= 0 ? state.races[state.currentRaceIndex] : null;
    // url-config-separation (2026-04-20): data_source 解決は DERUCA_CONFIG に委譲。
    var dataUrl = race ? DERUCA_CONFIG.resolveDataSource(race.data_source) : null;
    // 2026-06-04: SCR-CUT-003 サイネージカットイン用 URL。slot.signage_url を解決して送信。
    //   要件定義書 v3.3 §3.2「サイネージカットイン、締切後30秒程度をオッズエリアに重畳表示」。
    var signageUrl = state.signage_url
      ? DERUCA_CONFIG.resolveDataSource(state.signage_url)
      : null;
    // 2026-06-29: 前日発売/対象レース固定 context（§3.5.4）。子は target_date_offset>=1 で
    //   ヘッダを「前日発売」モードに切替える（renderRaceHeader）。
    var saleContext = {
      type: 'setSaleContext',
      target_race_no: state.target_race_no,
      target_date_offset: state.target_date_offset || 0
    };
    // 2026-08-04: dp11/12/13 の固定ページ（?page=N）を付与（ISH-14）
    var childQuery = childQueryFor(state);
    if (iframe.getAttribute('data-template') !== state.template) {
      iframe.setAttribute('data-template', state.template);
      iframe.removeAttribute('data-sig'); // video から odds に切り替わるケースを考慮
      iframe.src = state.template + childQuery;
      iframe.onload = (function(d, bg, su, sc, cutinKey, seedKey) {
        return function() {
          // 2026-07-15: CRM 背景色を芥川ヘッダークラス付け替えで適用（applyHeaderColor 参照）。
          //   旧 Phase 5 の CSS 変数注入（--race-header-bg / has-custom-bg）は受け側 CSS
          //   未実装で機能していなかったため廃止。
          applyHeaderColor(iframe, bg);
          // 2026-08-05 (引地様 №21): カットイン発火済み状態を復元する。
          //   ページ送り（dp20/30/40）は iframe をリロードするため、これが無いと
          //   同じレースの「締切5分前」がページ送りのたびに再発火する。
          //   ⚠ setDataUrl より前に送ること（子の初回 poll → checkCutin より先に届かせる）。
          if (cutinKey || seedKey) {
            try {
              iframe.contentWindow.postMessage({
                type: 'restoreCutinState', shownForRace: cutinKey,
                shownKeys: seedKey.shown, seededKeys: seedKey.seeded
              }, '*');
            } catch (_) {}
          }
          // 2026-06-04: signage_url 送信 (CUT-003 用、テンプレに依存しない共通 postMessage)
          if (su) {
            try {
              iframe.contentWindow.postMessage({
                type: 'setSignageUrl', url: su
              }, '*');
            } catch (_) {}
          }
          // 2026-06-29: sale context（前日発売/対象レース固定）を先に送る
          try { iframe.contentWindow.postMessage(sc, '*'); } catch (_) {}
          if (!d) return;
          try {
            iframe.contentWindow.postMessage({
              type: 'setDataUrl', url: d
              // server_time-fix-v3 (2026-04-20): baseOffset 撤去、offset 伝達は setServerOffset に一本化
            }, '*');
          } catch (_) {}
        };
      })(dataUrl, state.back_color_code, signageUrl, saleContext, state.cutinShownForRace,
         { shown: state.cutinShownKeys || {}, seeded: state.cutinSeededKeys || {} });
      if (dataUrl) iframe.setAttribute('data-source', dataUrl);
    } else if (iframe.getAttribute('data-source') !== dataUrl) {
      // template 同じ・data_source のみ変化 = レース遷移 or slot切替で data_source 更新
      if (dataUrl) iframe.setAttribute('data-source', dataUrl);
      // 2026-07-15: slot 切替で同一テンプレのまま背景色だけ変わるケースに対応（iframe 非リロード経路）
      applyHeaderColor(iframe, state.back_color_code);
      try {
        iframe.contentWindow.postMessage(saleContext, '*'); // 2026-06-29: 前日発売 context 再送
        iframe.contentWindow.postMessage({
          type: 'setDataUrl', url: dataUrl
          // server_time-fix-v3 (2026-04-20): baseOffset 撤去、offset 伝達は setServerOffset に一本化
        }, '*');
        // signage_url も同タイミングで再送 (slot 切替で URL 変化する可能性に対応)
        if (signageUrl) {
          iframe.contentWindow.postMessage({
            type: 'setSignageUrl', url: signageUrl
          }, '*');
        }
      } catch (_) {}
    }
  }

  // 次レース遷移時の data_source のみ更新（iframe 再ロードしない）
  function applyOddsScreenDataSourceOnly(state) {
    var iframe = state.iframeEl;
    if (!iframe || state.currentRaceIndex < 0) return;
    var race = state.races[state.currentRaceIndex];
    if (!race) return;
    // url-config-separation (2026-04-20): data_source 解決は DERUCA_CONFIG に委譲。
    var dataUrl = DERUCA_CONFIG.resolveDataSource(race.data_source);
    iframe.setAttribute('data-source', dataUrl);
    try {
      iframe.contentWindow.postMessage({
        type: 'setDataUrl', url: dataUrl
        // server_time-fix-v3 (2026-04-20): baseOffset 撤去、offset 伝達は setServerOffset に一本化
      }, '*');
    } catch (_) {}
  }

  // ---- video screen（指示書09 T5-4 互換） ----
  // === BEGIN: TECH-VERIFICATION-ONLY ===
  function applyVideoScreen(state) {
    // 2026-07-15: 中央（GCH、dp90-94）は専用経路へ（池澤様 STG 実装の取り込み）
    if (window.DosVideoDisplay && DosVideoDisplay.isGreenPattern(state.displayPatternId)) {
      applyGreenChannelScreen(state);
      return;
    }
    var iframe = state.iframeEl;
    if (!iframe) return;
    var cfg = state.videoConfig || {};
    var videoTemplate = state.template;
    var sig = 'video|' + (cfg.venue_code || '') + '|' + (cfg.quality_mode || 'auto') + '|' + (cfg.quality_fixed || '') + '|' + (cfg.video_source_override || '')
            + '|' + cfg.audio_muted + '|' + cfg.volume;  // 2026-07-15: 音声設定変更でも再送（池澤様実装より）
    var needsReload = iframe.getAttribute('data-template') !== videoTemplate;
    var needsReconfig = iframe.getAttribute('data-sig') !== sig;

    var sendConfig = function() {
      var videoSource = DERUCA_CONFIG.buildVideoUrl(cfg);
      if (!videoSource) return;
      try {
        iframe.contentWindow.postMessage({
          type: 'setVideoConfig',
          video_source: videoSource,
          quality_mode: cfg.quality_mode != null ? cfg.quality_mode : 'auto',
          quality_cap:  cfg.quality_cap  != null ? cfg.quality_cap  : 4,
          audio_muted:  cfg.audio_muted  != null ? cfg.audio_muted  : false,
          volume:       cfg.volume       != null ? cfg.volume       : 0.7,
          // 2026-07-14: video-frame の左下ステータス（デバッグ表示）の表示可否。
          //   親 URL の ?debug=1 のときのみ true（情報バーと同一条件）。
          debug:        !document.body.classList.contains('no-debug')
        }, '*');
      } catch (_) {}
    };

    if (needsReload) {
      iframe.setAttribute('data-template', videoTemplate);
      iframe.setAttribute('data-sig', sig);
      iframe.removeAttribute('data-source');
      // 2026-08-14: 動画テンプレだけキャッシュバスターが付いておらず、
      //   video-frame.html を直しても旧版がキャッシュから読まれる状態だった。
      //   オッズ子テンプレ（state.template + childQuery）と同じ扱いに揃える。
      //   data-template は従来どおりクエリ無しで保持する（needsReload の比較キーのため）。
      iframe.src = videoTemplate + buildChildQuery();
      iframe.onload = sendConfig;
    } else if (needsReconfig) {
      iframe.setAttribute('data-sig', sig);
      sendConfig();
    }
  }

  // 2026-07-15: 中央（GCH、dp90-94）用。池澤様 STG 実装（7/15）をそのまま取り込み。
  //   gch-video-frame.html + assets/js/gch-video-frame.js / video-display.js とセット。
  //   postMessage 形式 setGreenChannelConfig（channel/audio_muted/volume）は池澤実装の契約。
  function applyGreenChannelScreen(state) {
    var iframe = state.iframeEl;
    if (!iframe) return;
    var template = 'templates/gch-video-frame.html';
    var cfg = state.videoConfig || {};
    var sig = 'green|' + cfg.channel + '|' + cfg.audio_muted + '|' + cfg.volume;
    var templateChanged = iframe.getAttribute('data-template') !== template;
    var sigChanged = iframe.getAttribute('data-sig') !== sig;
    var sendConfig = function() {
      try {
        iframe.contentWindow.postMessage({
          type: 'setGreenChannelConfig',
          channel: cfg.channel,
          audio_muted: cfg.audio_muted,
          volume: cfg.volume
        }, '*');
      } catch (_) {}
    };
    var onload = function() {
      if (iframe.getAttribute('data-template') === template
       && iframe.getAttribute('data-sig') === sig) {
        sendConfig();
      }
      if (iframe.onload === onload) iframe.onload = null;
    };

    iframe.removeAttribute('data-source');
    if (templateChanged || sigChanged) {
      iframe.onload = onload;
    }
    if (templateChanged) {
      iframe.setAttribute('data-template', template);
      iframe.setAttribute('data-sig', sig);
      iframe.src = template;
    } else if (sigChanged) {
      iframe.setAttribute('data-sig', sig);
      sendConfig();
    }
  }
  // === END: TECH-VERIFICATION-ONLY ===

  // 2026-07-30: 払戻の到着でレースを送る（§5-1・及川決定）。
  //   results JSON の「存在」は発走したことしか意味しない（発走+1分で空の器が作られる）。
  //   確定の判定は payouts.win の中身で行う。
  //   レース単位で状態を持ち、確定したら以後 fetch しない。画面が同じレースを見ている場合は共有される。
  var _payoutProbe = {};   // race_id -> { checkedAt, confirmed }

  function resultsUrlOf(race) {
    if (!race || !race.data_source) return null;
    if (race.data_source.indexOf('odds/') !== 0) return null;
    return DERUCA_CONFIG.resolveDataSource('results/' + race.data_source.slice('odds/'.length));
  }

  // 確定していれば true。未確定なら false を返しつつ、間隔を空けて非同期に確認する。
  function isPayoutConfirmed(race, now) {
    var id = race.race_id || race.data_source;
    var st = _payoutProbe[id] || (_payoutProbe[id] = { checkedAt: 0, confirmed: false });
    if (st.confirmed) return true;
    if (now - st.checkedAt < RESULT_CHECK_INTERVAL_MS) return false;
    st.checkedAt = now;
    var url = resultsUrlOf(race);
    if (!url) return false;
    fetch(url, { cache: 'no-cache' })
      .then(function(r) { return r.ok ? r.json() : null; })
      .then(function(d) {
        var win = d && d.payouts && d.payouts.win;
        if (win && win.length) {
          st.confirmed = true;
          console.info('[next-race] 払戻を確認 → 次レースへ: ' + id);
        }
      })
      .catch(function() {});   // 未生成(403/404)・通信断は「未確定」として次回に持ち越す
    return false;
  }

  // 2026-08-19: 払戻の有無を 1 回だけ確認して _payoutProbe に載せる（Promise 版）。
  //   isPayoutConfirmed は「毎秒 tick から呼ぶ」前提の同期 API で**初回は必ず false** を返す。
  //   起動時はその false のせいで確定済みの前レースを掴むので、await できる形が要る。
  function probePayoutOnce(race) {
    var id = race.race_id || race.data_source;
    var st = _payoutProbe[id] || (_payoutProbe[id] = { checkedAt: 0, confirmed: false });
    if (st.confirmed) return Promise.resolve(true);
    var url = resultsUrlOf(race);
    if (!url) return Promise.resolve(false);
    return fetch(url, { cache: 'no-cache' })
      .then(function(r) { return r.ok ? r.json() : null; })
      .then(function(d) {
        var win = d && d.payouts && d.payouts.win;
        if (win && win.length) st.confirmed = true;
        return st.confirmed;
      })
      .catch(function() { return false; });   // 未生成(403/404)・通信断は「未確定」
  }

  // 🔴 2026-08-19: 初期レース選択の**前に**、掴む候補レースの払戻を先読みする。
  //   これが無いと「リロードのたびに前の R が約 2 秒映ってから当該 R に飛ぶ」。
  //   待つのは先頭頁だけ。他頁は 15 秒後に出るので fire-and-forget で温めれば間に合う
  //   （頁が別の場を出す構成では、温めておかないと同じ往復がその頁で起きる）。
  function prefetchPayoutProbes(states, now, venueFilters) {
    var seen = {}, jobs = [];
    function collect(races, shouldAwait) {
      if (!races || races.length <= 1) return;
      var start = getInitialRaceIndex(races, now);
      if (start < 0) return;
      for (var i = start; i < races.length && i < start + PAYOUT_PREFETCH_MAX; i++) {
        var postMs = Date.parse(races[i].post_time_iso);
        if (isNaN(postMs) || now < postMs) break;   // 発走前のレースに払戻は来ない
        var id = races[i].race_id || races[i].data_source;
        if (seen[id]) continue;
        seen[id] = 1;
        var pr = probePayoutOnce(races[i]);
        if (shouldAwait) jobs.push(pr);
      }
    }
    (states || []).forEach(function(st) {
      if (!st || st.type === 'video' || st.target_race_no != null) return;
      collect(st.races, true);
      (st.pages || []).forEach(function(pg, idx) {
        if (idx === 0 || !pg || pg.type === 'video' || pg.target_race_no != null) return;
        collect(applyVenueFilters(pg.races || [], venueFilters), false);
      });
    });
    if (!jobs.length) return Promise.resolve();
    return Promise.race([
      Promise.all(jobs),
      new Promise(function(resolve) { setTimeout(resolve, PAYOUT_PREFETCH_TIMEOUT_MS); })
    ]);
  }

  // H-04 Phase 1 §5.3-5.4: 1秒tickでの次レース遷移判定
  function checkNextRaceTransitions() {
    var now = correctedNow();
    screenStates.forEach(function(state) {
      if (state.type === 'video') return;
      if (state.currentRaceIndex < 0) return;
      if (state.target_race_no != null) return;  // 2026-06-29: 対象レース固定は順送りしない（§3.5.4）
      if (state.races.length <= 1) return;  // 1レース固定は遷移なし
      // 2026-07-30: 末尾レースは遷移先が無い（transitionToNextRace が no-op）。
      //   ここで抜けないと payout モードのフェイルセーフが毎秒 warn を出し続ける。
      if (state.currentRaceIndex + 1 >= state.races.length) return;
      var currentRace = state.races[state.currentRaceIndex];
      if (!currentRace || !currentRace.post_time_iso) return;
      var postMs = Date.parse(currentRace.post_time_iso);
      if (isNaN(postMs)) return;

      if (RACE_ADVANCE_MODE === 'timer') {
        if (now < postMs + NEXT_RACE_DELAY_SEC * 1000) return;
        transitionToNextRace(state, now);
        return;
      }

      // payout モード
      if (now < postMs) return;                                   // 発走前は動かさない
      if (now >= postMs + NEXT_RACE_FALLBACK_SEC * 1000) {        // 中止・欠損時のフェイルセーフ
        console.warn('[next-race] 払戻が来ないため強制遷移: ' + (currentRace.race_id || ''));
        transitionToNextRace(state, now);
        return;
      }
      if (isPayoutConfirmed(currentRace, now)) transitionToNextRace(state, now);
    });
  }

  function transitionToNextRace(state, now) {
    if (now - state.lastTransitionMs < 2000) return;  // 重複発火防止
    var nextIndex = state.currentRaceIndex + 1;
    if (nextIndex >= state.races.length) return;       // 末尾: 継続表示
    state.currentRaceIndex = nextIndex;
    state.currentRaceId = state.races[nextIndex].race_id;
    state.lastTransitionMs = now;
    // 2026-08-05: レースが変わったらページ送り関連の判定をやり直す。
    //   №22 oddsPageAvailable … 頭数が変わるので前レースの可否を持ち越さない
    //                            （新レースのデータ受信後に子からの通知で再判定）
    //   №21 cutinShownForRace … カットインは raceKey 込みなので実害は無いが、
    //                            前レースのキーを残さない
    state.oddsPageAvailable = [];
    // 2026-08-19: 集合方式ではレースごとにキーが違うのでクリア不要
    //   （クリアすると前レースの発火済みを忘れ、掴み直しで再発火する）
    state.cutinShownForRace = null;
    state.cutinActive = false;
    state.oddsPageHoldSec = 0;
    applyOddsScreenDataSourceOnly(state);
    // H-03 (2026-04-19): レース切替時は枠連/枠単ページを初期値 'uren' に戻す
    //   iframe 側 DOM は継続使用（再ロードなし）のため、前レースの表示状態（utan）が
    //   残り得る。明示的に 'uren' へ戻して一貫性を確保。
    //   hasFrameUtan も初期値 true に戻す（新レースのデータ受信後に子からの通知で再判定）。
    if (state.template === 'templates/single-screen.html') {
      state.frameOddsPage = 'uren';
      state.frameOddsPageTick = 0;
      state.hasFrameUtan = true;
      notifyFrameOddsPage(state);
    }
  }

  // ---- スロット選択 ----
  // slots[] から correctedNow に含まれるスロットを選ぶ。なければ直近の未来スロット or 最後のスロット。
  function pickCurrentSlotIndex(slots) {
    if (!slots || !slots.length) return -1;
    var now = correctedNow();
    // 1) now が start..end に収まるスロット
    for (var i = 0; i < slots.length; i++) {
      var s = resolveSlotTime(slots[i].start_time);
      var e = resolveSlotTime(slots[i].end_time);
      if (!isNaN(s) && !isNaN(e) && now >= s && now < e) return i;
    }
    // 2) now がどれにも該当しないとき、start が now より過去の最も新しいスロット
    var latestIdx = -1, latestStart = -Infinity;
    for (var j = 0; j < slots.length; j++) {
      var st = resolveSlotTime(slots[j].start_time);
      if (!isNaN(st) && st <= now && st > latestStart) {
        latestStart = st;
        latestIdx = j;
      }
    }
    if (latestIdx >= 0) return latestIdx;
    // 3) すべて未来 → 最初のスロット
    return 0;
  }

  var currentSlotIndex = -1;
  var currentSlotSig = null;

  // 2026-08-04: slot の「中身」が変わったかを判定するシグネチャ（ISH-19 / 木暮様 事象①）。
  //   従来 applyCurrentSlot は slot_id の変化でしか screenStates を再構築しなかった。
  //   CRM で「時間帯（time_section）はそのまま、中の画面設定（layout_section）だけ変更」した
  //   場合は slot_id が変わらないため、スケジュールJSONを 30 秒ごとに取り直していても
  //   画面が作り直されず、F5 するまで古い設定が残り続けた。
  //     ・引地様 ISH-19「札幌→新潟に変えてもオッズ画面は札幌のまま」
  //     ・木暮様 事象①「ナイターに切り替えても画面が止まったまま。手動 F5 まで復帰しない」
  //   video 画面が data-sig で行っている「設定が変わったか」の判定を slot 全体へ広げる。
  //   ⚠ server_time など毎ポーリングで変わる値は絶対に入れない（毎回再構築＝画面が点滅する）。
  function slotSignature(slot, venueFilters) {
    var parts = [slot.layout_pattern || slot.layout || ''];
    (slot.screens || []).forEach(function(sc) {
      var races = sc.races || [];
      parts.push([
        sc.position || sc.layout_section || '',
        sc.display_pattern_id,
        sc.type || 'odds',
        sc.place_cd == null ? '' : sc.place_cd,
        sc.back_color_code || '',
        sc.signage_url || '',
        sc.target_race_no == null ? '' : sc.target_race_no,
        sc.target_date_offset || 0,
        races.length,
        races.map(function(r) { return r.data_source || r.race_id || ''; }).join('~'),
        JSON.stringify(sc.video_config || null),
        // 2026-08-18: 頁（pages[]、v0.6.7 §3.5.2.2）の構成も「中身」に含める。
        //   CRM で「時間帯はそのまま、画面選択2〜4 だけ差し替え」した場合、
        //   ここに入れないと screenStates が組み直されず F5 まで古い頁が回り続ける。
        //   ⚠ 頁ごとの races も含める（場をまたぐ頁は参照先が丸ごと変わるため）。
        'pg:' + (sc.pages || []).map(function(pg) {
          return [
            pg.display_pattern_id,
            pg.place_cd == null ? '' : pg.place_cd,
            pg.organizer_type || '',
            pg.target_race_no == null ? '' : pg.target_race_no,
            pg.target_date_offset || 0,
            (pg.races || []).length,
            (pg.races || []).map(function(r) { return r.data_source || r.race_id || ''; }).join('~'),
            JSON.stringify(pg.video_config || null)
          ].join(',');
        }).join(';')
      ].join('|'));
    });
    parts.push('vf:' + JSON.stringify(venueFilters || []));
    return parts.join('#');
  }

  // H-04 (2026-04-17): 旧 applyCurrentRace → applyCurrentSlot に刷新。
  //   race_rotation_seconds を廃止し、slot.screens[] から screenStates を構築。
  //   2026-08-04: 再構築の条件を「slot_id の変化」から「slot_id または中身の変化」へ拡張。
  function applyCurrentSlot(schedule) {
    var slots = schedule.slots;
    // 2026-08-10: 設定が無い時間帯で全画面が真っ黒になるのをやめ、案内を出す（立川 TAC-11・木暮様）。
    //   現地では「モニターか PC の電源が入っていない」ように見え、故障と区別できない。
    //   ISH-18（モニターID未指定）で入れた「黙って何も出さない、をやめる」方針と同じ趣旨。
    //   ※ fatal と違い復帰するため body は壊さず、オーバーレイを重ねて次のポーリングで消す。
    if (!slots || !slots.length) { showNoScheduleNotice(null); return; }
    var slotIdx = pickCurrentSlotIndex(slots);
    var slot = slots[slotIdx] || {};
    if (!slot.screens || !slot.screens.length) { showNoScheduleNotice(slots); return; }
    hideNoScheduleNotice();

    var slotSig = slotSignature(slot, schedule.venue_filters);
    var slotIdChanged = (currentSlotId !== slot.slot_id);
    var slotChanged = slotIdChanged || (currentSlotSig !== slotSig);
    if (slotChanged) {
      if (currentSlotIndex >= 0) setStatus(slotIdChanged ? 'スロット切替中' : '設定更新中');
      currentSlotId = slot.slot_id;
      currentSlotSig = slotSig;
      currentSlotIndex = slotIdx;

      // 指示書09 T5-3: slot.layout に応じて CSS クラスを切替
      // v0.6.3 dual-read: layout_pattern（新）優先、無ければ layout（旧）
      applyLayout(slot.layout_pattern || slot.layout);

      // screenStates を再構築（slot 内では不変）。venue_filters は schedule トップレベル（§3.13）。
      screenStates.forEach(abortPagePreload);   // 案B: 旧スロットの先読みを捨てる
      hideAllBufferIframes();
      screenStates = buildScreenStates(slot, schedule.venue_filters);
      // 🔴 2026-08-19: 初期レースを決める前に払戻を先読みする（prefetchPayoutProbes 参照）。
      //   描画が最大 1.5 秒遅れるが、遅らせないと**必ず**前の R が一瞬映る。
      var built = screenStates;
      prefetchPayoutProbes(built, correctedNow(), schedule.venue_filters).then(function() {
        if (screenStates !== built) return;   // 先読み中にスロットが変わったら破棄
        built.forEach(initializeScreen);
        clearUnusedFrames();
        updateInfoBarSlotAndRace(slot);
      });
    }

    // 情報バー（P1 代表表示、H-04 Phase 1 §9.7 案D1）
    updateInfoBarSlotAndRace(slot);
  }

  function updateInfoBarSlotAndRace(slot) {
    document.getElementById('barSlot').textContent = slot.slot_id != null ? slot.slot_id : '-';
    // P1 を優先、無ければ最初のodds screenを代表として表示
    var rep = null;
    for (var i = 0; i < screenStates.length; i++) {
      var s = screenStates[i];
      if (s.type === 'video') continue;
      if (s.currentRaceIndex < 0) continue;
      if (s.position === 'P1') { rep = s; break; }
      if (!rep) rep = s;
    }
    var raceLabel = '-';
    if (rep) {
      var race = rep.races[rep.currentRaceIndex];
      if (race) raceLabel = race.race_key || race.race_id || '-';
    }
    document.getElementById('barRace').textContent = raceLabel;
  }

  // ---- 時間帯切替 ----
  // slots[] 形式では現在のスロットの end_time を次の切替点として扱う。
  function getNextSlotTransitionMs(schedule) {
    if (!schedule) return NaN;
    if (schedule.slots && schedule.slots.length) {
      // 現在スロットの end_time、または次スロットの start_time（早い方）
      if (currentSlotIndex >= 0 && currentSlotIndex < schedule.slots.length) {
        var endMs = resolveSlotTime(schedule.slots[currentSlotIndex].end_time);
        return endMs;
      }
      // fallback: 最初の未来スロットの start_time
      var now = correctedNow();
      for (var i = 0; i < schedule.slots.length; i++) {
        var s = resolveSlotTime(schedule.slots[i].start_time);
        if (!isNaN(s) && s > now) return s;
      }
    }
    // 旧形式
    if (schedule.next_slot && schedule.next_slot.start_time) {
      return resolveSlotTime(schedule.next_slot.start_time);
    }
    return NaN;
  }

  function checkSlotTransition(schedule) {
    // H-04 (2026-04-17): スロット境界到達時に applyCurrentSlot 再実行。
    //   screenStates の再構築は applyCurrentSlot 内で slot_id 変化を検知して行われる。
    var transitionMs = getNextSlotTransitionMs(schedule);
    if (isNaN(transitionMs)) return;
    if (correctedNow() >= transitionMs) {
      applyCurrentSlot(schedule);
    }
  }

  function setStatus(s) {
    var el = document.getElementById('barStatus');
    if (el) el.textContent = s;
  }

  // ---- メインループ: 指示書07 指数バックオフ付きポーリング ----
  // スケジュール取得失敗時は画面遷移やリロードはせず、現在のスロット表示を維持する。
  // 情報バーの status に連続失敗回数を反映。
  var schedulePoller = null;
  function startSchedulePolling() {
    if (schedulePoller) schedulePoller.stop();
    schedulePoller = window.OddsDemo.startResilientPolling({
      name: 'schedule',
      baseIntervalMs: SCHEDULE_POLL_SEC * 1000,
      fetch: fetchSchedule,
      onSuccess: function(sched) {
        currentSchedule = sched;
        applyCurrentSlot(sched);
        setStatus('正常');
      },
      onFailure: function(err, failCount) {
        setStatus('スケジュール取得失敗（連続' + failCount + '回）');
        // 2026-08-10: **一度も描画できていない**ときだけ案内を出す（立川 TAC-11・木暮様）。
        //   その日の設定が無い（＝スケジュール JSON が未生成）と 404 になり、
        //   従来は真っ黒のままで「モニターか PC の電源が入っていない」ように見えていた。
        //   すでに描画できている場合は**現在の表示を維持**する（従来どおり。一時的な通信断で
        //   売場の画面を消さない）。
        if (currentSlotIndex < 0) showNoScheduleNotice(null);
      }
    });
    window.OddsDemo.registerPoller(schedulePoller);
  }

  // 表示用1秒tick（純クライアント側。サーバ負荷には一切寄与しない）
  // H-04 (2026-04-17): 1秒tick で以下をまとめて実行:
  //   1. 情報バー表示更新
  //   2. slot情報バーの最新化（screenStates の race 表示を反映）
  //   3. 次レース遷移判定（checkNextRaceTransitions）
  setInterval(function() {
    document.getElementById('barServerTime').textContent = fmtTime(new Date(correctedNow()));
    document.getElementById('barOffset').textContent = Math.round(serverOffset);

    if (currentSchedule) {
      var transitionMs = getNextSlotTransitionMs(currentSchedule);
      if (!isNaN(transitionMs)) {
        var ms = transitionMs - correctedNow();
        if (ms > 0) {
          var sec = Math.floor(ms / 1000);
          var h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
          document.getElementById('barNextSwitch').textContent = pad2(h) + ':' + pad2(m) + ':' + pad2(s);
        } else {
          document.getElementById('barNextSwitch').textContent = '切替中';
        }
      }
    }

    // H-04: 1秒tick で次レース遷移判定を実施
    if (currentSchedule && screenStates.length) {
      checkNextRaceTransitions();
      // H-03: 1秒tick で枠連/枠単の 15秒周期切替を実施
      checkFrameOddsPaging();
      // 2026-07-15: dp50（出走成績）の自動ページング（1-3R→…→10-12R ループ）
      checkEntriesResultsPaging();
      // 2026-08-04: dp20/30/40（馬連・馬単・人気順）の自動ページング（ISH-14 ②③）
      checkOddsAutoPaging();
      // 2026-08-18: 区画内の頁ローテーション（pages[]、v0.6.7 §3.5.2.2）
      checkScreenPageRotation();
      // 情報バーのレース表示を最新化（遷移発生時に表示も更新）
      var slots = currentSchedule.slots || [];
      var currentSlot = null;
      for (var i = 0; i < slots.length; i++) {
        if (slots[i].slot_id === currentSlotId) { currentSlot = slots[i]; break; }
      }
      if (currentSlot) updateInfoBarSlotAndRace(currentSlot);
    }
  }, DISPLAY_TICK_SEC * 1000);

  // H-03 (2026-04-19): 枠連・枠単の自動ページング管理
  //   template === 'templates/single-screen.html' の screenState に対し、1秒tickで経過秒を加算し、
  //   FRAME_UTAN_PAGE_SEC（15秒）経過で 'uren'↔'utan' を切り替え iframe に postMessage 通知。
  //   他 template は対象外（Tick数も進めない = 無駄処理回避）。
  function checkFrameOddsPaging() {
    screenStates.forEach(function(state) {
      if (state.type !== 'odds') return;
      if (state.template !== 'templates/single-screen.html') return;
      if (!state.iframeEl) return;
      // H-03 (2026-04-19 改訂): 枠単発売なしレースはページング停止
      if (state.hasFrameUtan === false) return;
      state.frameOddsPageTick = (state.frameOddsPageTick || 0) + 1;
      if (state.frameOddsPageTick >= FRAME_UTAN_PAGE_SEC) {
        state.frameOddsPageTick = 0;
        state.frameOddsPage = (state.frameOddsPage === 'uren') ? 'utan' : 'uren';
        notifyFrameOddsPage(state);
      }
    });
  }

  function notifyFrameOddsPage(state) {
    if (!state.iframeEl || !state.iframeEl.contentWindow) return;
    try {
      state.iframeEl.contentWindow.postMessage({
        type: 'frameOddsPage',
        page: state.frameOddsPage
      }, '*');
    } catch (_) {}
  }

  // 時間帯切替の判定はスケジュールpoll とは別の軽量 tick。サーバ通信は発生しない。
  setInterval(function() {
    if (currentSchedule) checkSlotTransition(currentSchedule);
  }, SLOT_TICK_SEC * 1000);

  // 子iframeからのレポート受信
  window.addEventListener('message', function(e) {
    var d = e.data;
    if (!d) return;
    if (d.type === 'childServerTime') {
      childOffsets[d.url] = d.offset;
      return;
    }
    // server_time-fix-v3 (2026-04-20): 子 common.js 起動直後のハンドシェイク要求に応答。
    //   iframe.onload と <script> ロード完了のタイミング不一致を解消し、
    //   全子 iframe が起動 1 秒以内に最新 serverOffset を受信できることを保証する。
    if (d.type === 'requestServerOffset') {
      sendServerOffsetTo(e.source);
      return;
    }
    // 乙案: テンプレが自分でページ送りする dp（dp10 馬連ワイド）のページ数を受ける。
    //   親は頭数を知らないのでページ数を算出できない。滞在時間の計算に使う。
    if (d.type === 'childPageCount') {
      var pcState = findScreenStateBySource(e.source) || findPreloadOwner(e.source);
      if (pcState) {
        var tgt = (pcState.preload && pcState.preload.st.iframeEl
                   && pcState.preload.st.iframeEl.contentWindow === e.source)
                  ? pcState.preload.st : pcState;
        tgt.childPageCount = Number(d.count) || 1;
      }
      return;
    }
    // 案B: 裏の頁が「描画まで済んだ」と言ってきた。入れ替えてよい印を立てる。
    if (d.type === 'renderReady') {
      var owner = findPreloadOwner(e.source);
      if (owner && owner.preload) owner.preload.ready = true;
      return;
    }
    // H-03 (2026-04-19 改訂): 子 single-screen.html から枠単発売有無の通知受信
    //   発売なし時はページング停止、強制的に枠連表示へ戻す
    if (d.type === 'frameUtanAvailability') {
      var state = findScreenStateBySource(e.source);
      if (!state) return;
      state.hasFrameUtan = !!d.available;
      if (!state.hasFrameUtan && state.frameOddsPage !== 'uren') {
        state.frameOddsPage = 'uren';
        state.frameOddsPageTick = 0;
        notifyFrameOddsPage(state);
      }
      return;
    }
    // 2026-08-05 (引地様 №22): オッズ画面 各ページの中身の有無を子から受信。
    //   frameUtanAvailability と同じ「子が判定 → 親がページ送りを止める」パターン。
    //   表示中の子が**全ページ分**を答えるので、空のページは一度も画面に出ない。
    //   対象: 馬番順マトリクス（dp20/30）と人気順（dp40）。
    if (d.type === 'oddsPagesAvailability') {
      var mState = findScreenStateBySource(e.source);
      if (!mState || !mState.oddsPageCount) return;
      // 種別が食い違う通知は無視（slot 切替直後に前テンプレの通知が届くことがある）
      if (d.kind && mState.oddsPageKind && d.kind !== mState.oddsPageKind) return;
      mState.oddsPageAvailable = d.pages || [];
      // 既に空のページを表示してしまっている場合（頭数が変わった等）は中身のあるページへ戻す
      if (!oddsPageIsAvailable(mState, mState.oddsPageIndex)) {
        var back = nextAvailableOddsPage(mState);
        if (back !== mState.oddsPageIndex) {
          console.warn('[odds-paging] 中身の無いページを表示中のため戻す: '
            + mState.oddsPageKind + ' page' + (mState.oddsPageIndex + 1)
            + ' (' + d.horses + '頭)');
          mState.oddsPageIndex = back;
          mState.oddsPageTick = 0;
          sendOddsPage(mState);   // src は触らない
        }
      }
      return;
    }
    // 2026-08-05 (引地様 №21): 子のカットイン状態を受信。
    //   ・shownForRace を親が保持し、ページ送りでリロードした子へ復元する（再発火の防止）
    //   ・表示中（active）はページ送りを保留する（10秒/30秒の表示を途中で切らない）
    if (d.type === 'cutinState') {
      var cState = findScreenStateBySource(e.source);
      if (!cState) return;
      if (d.shownForRace) cState.cutinShownForRace = d.shownForRace;
      // 2026-08-19: 発火済み／評価済みの**キー集合**を親に集約する（区画に1組）
      cState.cutinShownKeys = cState.cutinShownKeys || {};
      cState.cutinSeededKeys = cState.cutinSeededKeys || {};
      var kk;
      for (kk in (d.shownKeys || {})) { cState.cutinShownKeys[kk] = 1; }
      for (kk in (d.seededKeys || {})) { cState.cutinSeededKeys[kk] = 1; }
      cState.cutinActive = !!d.active;
      if (!cState.cutinActive) cState.oddsPageHoldSec = 0;
      return;
    }
  });

  // H-03: postMessage の送信元 Window から screenState を引く
  function findScreenStateBySource(sourceWin) {
    for (var i = 0; i < screenStates.length; i++) {
      var s = screenStates[i];
      if (s.iframeEl && s.iframeEl.contentWindow === sourceWin) return s;
    }
    return null;
  }

  // 情報バーをキーボード（H）でトグル
  window.addEventListener('keydown', function(e) {
    if (e.key === 'h' || e.key === 'H') {
      document.body.classList.toggle('hide-bar');
    }
  });

  // 起動
  startSchedulePolling();
})();
</script>

</body>
